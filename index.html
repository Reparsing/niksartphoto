<!DOCTYPE html>
<html lang="ru" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Артурик — Кадр решает</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== БАЗОВЫЙ СБРОС ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0c;
            color: #f4f4f5;
            overflow-x: hidden;
            line-height: 1.7;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        a { text-decoration: none; color: inherit; transition: all .3s; }
        img { display: block; max-width: 100%; }

        :root {
            --brand: #fbbf24;
            --brand-glow: rgba(251, 191, 36, 0.3);
            --brand-subtle: rgba(251, 191, 36, 0.12);
            --hairline: rgba(255, 255, 255, 0.08);
            --subtle: #a1a1aa;
            --muted: #71717a;
            --default: #f4f4f5;
            --card-bg: rgba(18, 18, 22, 0.6);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: var(--brand); border-radius: 10px; }

        /* ============================================
           ЭКРАН-ПРИВЕТСТВИЕ (Splash Screen)
           ============================================ */
        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0c;
            color: #f4f4f5;
            font-family: 'Inter', sans-serif;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-content {
            max-width: 640px;
            width: 90%;
            padding: 40px 20px;
            text-align: center;
            animation: splashFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        @keyframes splashFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ===== КРЕСТИК (КНОПКА ЗАКРЫТИЯ) ===== */
        .splash-close {
            position: absolute;
            top: 0;
            right: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--hairline);
            color: var(--subtle);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Inter', sans-serif;
            padding: 0;
            line-height: 1;
        }

        .splash-close:hover {
            background: var(--brand);
            color: #0a0a0c;
            border-color: var(--brand);
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 0 30px var(--brand-glow);
        }

        .splash-close:active {
            transform: rotate(90deg) scale(0.9);
        }

        /* Заголовки */
        .splash-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 28px;
        }
        .splash-greeting {
            font-size: 2.2rem;
            font-weight: 300;
            color: var(--subtle);
            animation: textGlow 2.5s ease-in-out infinite alternate;
        }
        .splash-name {
            font-size: 4.2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 2.5s ease-in-out infinite alternate;
        }
        .splash-sub {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--brand);
            opacity: 0.7;
        }

        @keyframes textGlow {
            0% { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.05)); }
            100% { filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.15)); }
        }

        /* Вопрос */
        .splash-question {
            font-size: 1.15rem;
            color: var(--subtle);
            margin-bottom: 28px;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* Сетка кнопок */
        .splash-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        @media (max-width: 480px) {
            .splash-options {
                grid-template-columns: 1fr;
            }
            .splash-greeting { font-size: 1.6rem; }
            .splash-name { font-size: 3rem; }
            .splash-close {
                top: -8px;
                right: -8px;
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }
        }

        /* Стиль кнопок */
        .splash-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 14px;
            border-radius: 16px;
            border: 1px solid var(--hairline);
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            color: #f4f4f5;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .splash-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--brand-subtle);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .splash-btn:hover {
            transform: translateY(-4px) scale(1.03);
            border-color: var(--brand);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .splash-btn:hover::before {
            opacity: 1;
        }

        .splash-btn:active {
            transform: scale(0.94);
        }

        .splash-btn-icon {
            font-size: 1.5rem;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        .splash-btn span:last-child {
            position: relative;
            z-index: 1;
        }

        /* Обратная связь */
        .splash-feedback {
            min-height: 2.4rem;
            font-size: 0.95rem;
            color: var(--brand);
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .splash-feedback.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Анимация для уходящего экрана */
        .splash-screen.exit {
            animation: splashExit 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes splashExit {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.06); filter: blur(10px); }
        }

        /* Дополнительные частицы на экране приветствия */
        .splash-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .splash-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--brand);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 8s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0% { opacity: 0; transform: translateY(0) scale(0); }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-80px) scale(1); }
        }
    </style>
</head>
<body>

<!-- ============================================
     ЭКРАН-ПРИВЕТСТВИЕ (SPLASH SCREEN)
     ============================================ -->
<div class="splash-screen" id="splashScreen">
    <!-- Фоновые частицы -->
    <div class="splash-particles" id="splashParticles"></div>

    <div class="splash-content">
        <!-- КРЕСТИК (КНОПКА ЗАКРЫТИЯ) -->
        <button class="splash-close" id="splashClose" title="Пропустить">✕</button>

        <!-- Заголовок -->
        <h1 class="splash-title">
            <span class="splash-greeting">Привет!</span>
            <span class="splash-name">Я — Артурик</span>
            <span class="splash-sub">Кадр решает</span>
        </h1>

        <!-- Вопрос -->
        <p class="splash-question">Откуда вы узнали обо мне?</p>

        <!-- Варианты ответов -->
        <div class="splash-options">
            <button class="splash-btn" data-source="friends">
                <span class="splash-btn-icon">👥</span>
                <span>Через друзей Никса</span>
            </button>
            <button class="splash-btn" data-source="social">
                <span class="splash-btn-icon">📱</span>
                <span>Соцсети</span>
            </button>
            <button class="splash-btn" data-source="city">
                <span class="splash-btn-icon">🏙️</span>
                <span>Видел в городе</span>
            </button>
            <button class="splash-btn" data-source="ad">
                <span class="splash-btn-icon">📰</span>
                <span>Нашел объявление</span>
            </button>
        </div>

        <!-- Строка состояния (для обратной связи) -->
        <p class="splash-feedback" id="splashFeedback"></p>
    </div>
</div>
