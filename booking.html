<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Запись — Niks Art Photo</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
}

body {

    min-height: 100vh;

    overflow-x: hidden;

    background: #030303;

    color: #fff;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    --accent: #ffad28;
    --accent-rgb: 255,173,40;

    transition: background .4s ease;
}


/* =========================================================
   ФОН
========================================================= */

.background {

    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}

.glow {

    position: absolute;

    width: 560px;
    height: 560px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(var(--accent-rgb), .16),
            rgba(var(--accent-rgb), .05) 35%,
            transparent 70%
        );

    filter: blur(35px);

    animation:
        glowMove 12s ease-in-out infinite alternate;
}

.glow.one {
    left: -300px;
    top: -300px;
}

.glow.two {

    right: -300px;
    bottom: -300px;

    animation-delay: -5s;
    animation-duration: 15s;
}

@keyframes glowMove {

    0% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(100px,80px) scale(1.15);
    }

    100% {
        transform: translate(-40px,120px) scale(.9);
    }
}


/* =========================================================
   СКАН
========================================================= */

.scan {

    position: fixed;

    top: -20%;
    left: -20%;

    width: 140%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(var(--accent-rgb),0),
            rgba(var(--accent-rgb),.9),
            rgba(var(--accent-rgb),0),
            transparent
        );

    box-shadow:
        0 0 25px rgba(var(--accent-rgb),.45);

    opacity: .5;

    transform: rotate(-15deg);

    pointer-events: none;

    z-index: 2;

    animation:
        scan 6s linear infinite;
}

@keyframes scan {

    0% {
        top: -20%;
        opacity: 0;
    }

    15% {
        opacity: .5;
    }

    70% {
        opacity: .3;
    }

    100% {
        top: 120%;
        opacity: 0;
    }
}


/* =========================================================
   ЧАСТИЦЫ
========================================================= */

.particles {

    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;
}

.particle {

    position: absolute;

    bottom: -10px;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: var(--accent);

    box-shadow:
        0 0 8px var(--accent),
        0 0 18px rgba(var(--accent-rgb),.5);

    opacity: 0;

    animation:
        particle 8s linear infinite;
}

.particle:nth-child(1) {
    left: 7%;
}

.particle:nth-child(2) {
    left: 18%;
    animation-delay: 2s;
}

.particle:nth-child(3) {
    left: 29%;
    animation-delay: 4s;
}

.particle:nth-child(4) {
    left: 41%;
    animation-delay: 1s;
}

.particle:nth-child(5) {
    left: 53%;
    animation-delay: 3s;
}

.particle:nth-child(6) {
    left: 65%;
    animation-delay: 5s;
}

.particle:nth-child(7) {
    left: 76%;
    animation-delay: 2.5s;
}

.particle:nth-child(8) {
    left: 88%;
    animation-delay: 4.5s;
}

@keyframes particle {

    0% {

        transform:
            translateY(0)
            translateX(0)
            scale(.2);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    50% {
        opacity: .4;
    }

    100% {

        transform:
            translateY(-110vh)
            translateX(60px)
            scale(1);

        opacity: 0;
    }
}


/* =========================================================
   ОСНОВА
========================================================= */

.container {

    position: relative;

    z-index: 10;

    width:
        min(650px, calc(100% - 30px));

    margin: 0 auto;

    padding: 70px 0 60px;

    animation:
        pageAppear 1s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes pageAppear {

    from {

        opacity: 0;

        transform:
            translateY(35px)
            scale(.94);

        filter: blur(12px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }
}


/* =========================================================
   СТАТУС
========================================================= */

.status {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    width: max-content;

    margin: 0 auto 25px;

    padding: 8px 15px;

    border:
        1px solid
        rgba(var(--accent-rgb),.3);

    border-radius: 50px;

    background:
        rgba(var(--accent-rgb),.06);

    color: var(--accent);

    font-size: 11px;

    font-weight: 750;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--accent);

    box-shadow:
        0 0 10px var(--accent);

    animation:
        statusPulse 1.4s infinite;
}

@keyframes statusPulse {

    0%,
    100% {
        opacity: .35;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.25);
    }
}


/* =========================================================
   ЗАГОЛОВОК
========================================================= */

h1 {

    text-align: center;

    font-size:
        clamp(35px, 8vw, 58px);

    line-height: .98;

    font-weight: 900;

    letter-spacing: -2.8px;

    margin-bottom: 18px;

    background:

        linear-gradient(
            110deg,
            #fff,
            #fff 35%,
            var(--accent) 50%,
            #fff 65%,
            #fff
        );

    background-size: 250% 100%;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        titleShine 5s ease-in-out infinite;
}

@keyframes titleShine {

    0% {
        background-position: 200% center;
    }

    50% {
        background-position: 0 center;
    }

    100% {
        background-position: 200% center;
    }
}

.description {

    max-width: 520px;

    margin: 0 auto 35px;

    text-align: center;

    color: #858585;

    font-size: 15px;

    line-height: 1.7;
}


/* =========================================================
   ФОРМА
========================================================= */

.form {

    display: flex;

    flex-direction: column;

    gap: 18px;

    padding: 25px;

    border:
        1px solid #191919;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );

    box-shadow:
        0 30px 100px rgba(0,0,0,.4),

        inset 0 0 30px
        rgba(var(--accent-rgb),.025);
}


/* =========================================================
   LABEL
========================================================= */

.field {

    display: flex;

    flex-direction: column;

    gap: 8px;
}

label {

    color: #777;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1.8px;

    text-transform: uppercase;
}


/* =========================================================
   INPUT
========================================================= */

input,
textarea,
select {

    width: 100%;

    border:
        1px solid #252525;

    border-radius: 13px;

    outline: none;

    padding: 14px 15px;

    background: #090909;

    color: #fff;

    font-family: inherit;

    font-size: 14px;

    transition:

        border-color .2s ease,

        box-shadow .2s ease,

        background .2s ease;
}

input::placeholder,
textarea::placeholder {
    color: #444;
}

input:focus,
textarea:focus,
select:focus {

    border-color:
        rgba(var(--accent-rgb),.65);

    box-shadow:
        0 0 0 3px
        rgba(var(--accent-rgb),.06),

        0 0 25px
        rgba(var(--accent-rgb),.05);

    background: #0b0b0b;
}

textarea {

    min-height: 100px;

    resize: vertical;
}


/* =========================================================
   ДАТА
========================================================= */

.date-time {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}


/* =========================================================
   ВРЕМЯ
========================================================= */

.time-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}

.time-button {

    border:
        1px solid #242424;

    border-radius: 10px;

    padding: 11px 5px;

    background: #080808;

    color: #777;

    font-size: 12px;

    cursor: pointer;

    transition:
        .2s ease;
}

.time-button:hover {

    border-color:
        rgba(var(--accent-rgb),.45);

    color: #fff;

    transform:
        translateY(-1px);
}

.time-button.selected {

    border-color:
        var(--accent);

    background:
        rgba(var(--accent-rgb),.12);

    color:
        var(--accent);

    box-shadow:
        0 0 18px
        rgba(var(--accent-rgb),.08);
}


/* =========================================================
   КНОПКА
========================================================= */

.submit-button {

    position: relative;

    width: 100%;

    margin-top: 4px;

    padding: 16px;

    border:
        1px solid
        rgba(var(--accent-rgb),.6);

    border-radius: 14px;

    background:

        linear-gradient(
            135deg,
            rgba(var(--accent-rgb),.16),
            rgba(var(--accent-rgb),.04)
        );

    color: var(--accent);

    font-family: inherit;

    font-size: 14px;

    font-weight: 800;

    letter-spacing: .5px;

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

.submit-button:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--accent);

    box-shadow:
        0 12px 35px
        rgba(var(--accent-rgb),.14);
}

.submit-button:active {
    transform: scale(.98);
}

.submit-button:disabled {

    opacity: .5;

    cursor: not-allowed;

    transform: none;
}


/* =========================================================
   СИСТЕМА
========================================================= */

.system-message {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    margin-top: 25px;

    color: #444;

    font-size: 9px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    text-align: center;
}

.system-line {

    width: 30px;
    height: 1px;

    background: #292929;
}

.brand {

    margin-top: 28px;

    text-align: center;

    color: #292929;

    font-size: 9px;

    letter-spacing: 6px;

    text-transform: uppercase;
}


/* =========================================================
   RED MODE
========================================================= */

body.red-mode {

    --accent: #ff3030;

    --accent-rgb: 255,48,48;
}

.color-flash {

    position: fixed;

    inset: 0;

    z-index: 5000;

    background: #ff2020;

    opacity: 0;

    pointer-events: none;
}

.color-flash.active {

    animation:
        colorFlash .45s ease-out;
}

@keyframes colorFlash {

    0% {
        opacity: 0;
    }

    15% {
        opacity: .35;
    }

    35% {
        opacity: .12;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   SUCCESS / ERROR
========================================================= */

.message {

    display: none;

    padding: 14px;

    border-radius: 12px;

    font-size: 13px;

    line-height: 1.5;

    text-align: center;
}

.message.show {
    display: block;
}

.message.success {

    border:
        1px solid rgba(50,255,130,.25);

    background:
        rgba(50,255,130,.05);

    color: #73ffac;
}

.message.error {

    border:
        1px solid rgba(255,50,50,.25);

    background:
        rgba(255,50,50,.05);

    color: #ff7474;
}


/* =========================================================
   ПЕРЕХОД
========================================================= */

.transition {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

.transition.active {

    opacity: 1;

    visibility: visible;

    pointer-events: all;
}

.transition-content {

    width:
        min(500px, calc(100% - 35px));

    text-align: center;

    transform:
        translateY(20px)
        scale(.96);

    opacity: 0;

    transition:
        transform .7s
        cubic-bezier(.16,1,.3,1),
        opacity .5s ease;
}

.transition.active .transition-content {

    transform:
        translateY(0)
        scale(1);

    opacity: 1;
}


/* =========================================================
   LOADER
========================================================= */

.loader {

    position: relative;

    width: 80px;
    height: 80px;

    margin:
        0 auto 35px;
}

.loader-ring {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    border: 1px solid #222;

    border-top-color: #ff3030;

    border-right-color: #ff3030;

    animation:
        loaderRotate 1s linear infinite;
}

.loader-ring:nth-child(2) {

    inset: 10px;

    border-top-color: transparent;

    border-right-color: #ff5555;

    animation-duration: 1.5s;

    animation-direction: reverse;
}

.loader-dot {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 8px;
    height: 8px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background: #ff3030;

    box-shadow:
        0 0 20px #ff3030;
}

@keyframes loaderRotate {

    to {
        transform: rotate(360deg);
    }
}

.transition-title {

    font-size:
        clamp(22px,5vw,32px);

    font-weight: 800;

    margin-bottom: 12px;
}

.transition-sub {

    color: #555;

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.loading-line {

    width: 180px;

    height: 2px;

    margin:
        25px auto 0;

    overflow: hidden;

    background: #161616;
}

.loading-line::after {

    content: "";

    display: block;

    width: 40%;

    height: 100%;

    background: #ff3030;

    box-shadow:
        0 0 15px #ff3030;

    animation:
        loading 1.2s ease-in-out infinite;
}

@keyframes loading {

    0% {
        transform: translateX(-150%);
    }

    100% {
        transform: translateX(400%);
    }
}


/* =========================================================
   МОБИЛЬНЫЙ
========================================================= */

@media(max-width:500px) {

    .container {

        width:
            calc(100% - 24px);

        padding:
            45px 0 40px;
    }

    h1 {

        font-size: 34px;

        letter-spacing: -1.8px;
    }

    .form {

        padding: 18px;

        border-radius: 18px;
    }

    .date-time {

        grid-template-columns:
            1fr;
    }

    .time-grid {

        grid-template-columns:
            repeat(3, 1fr);
    }
}

@media(prefers-reduced-motion:reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;
    }
}

</style>
</head>

<body>

<div class="background">

    <div class="glow one"></div>
    <div class="glow two"></div>

</div>

<div class="scan"></div>

<div class="particles">

    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>

</div>

<div class="color-flash" id="colorFlash"></div>


<main class="container">

    <div class="status">

        <span class="status-dot"></span>

        Онлайн-запись

    </div>


    <h1>

        Запись<br>

        на съёмку

    </h1>


    <p class="description">

        Заполните небольшую форму ниже.
        Выберите удобную дату и время —
        заявка сразу придёт фотографу.

    </p>


    <form
        class="form"
        id="bookingForm"
    >


        <!-- ИМЯ -->

        <div class="field">

            <label for="name">
                Ваше имя
            </label>

            <input
                id="name"
                name="name"
                type="text"
                placeholder="Например, Никита"
                maxlength="80"
                required
            >

        </div>


        <!-- TELEGRAM -->

        <div class="field">

            <label for="telegram">
                Telegram / контакт
            </label>

            <input
                id="telegram"
                name="telegram"
                type="text"
                placeholder="@username или номер телефона"
                maxlength="100"
                required
            >

        </div>


        <!-- ДАТА -->

        <div class="field">

            <label for="date">
                Дата съёмки
            </label>

            <input
                id="date"
                name="date"
                type="date"
                required
            >

        </div>


        <!-- ВРЕМЯ -->

        <div class="field">

            <label>
                Время
            </label>

            <input
                type="hidden"
                id="time"
                name="time"
                required
            >

            <div
                class="time-grid"
                id="timeGrid"
            ></div>

        </div>


        <!-- КОММЕНТАРИЙ -->

        <div class="field">

            <label for="comment">
                Комментарий
            </label>

            <textarea
                id="comment"
                name="comment"
                maxlength="1000"
                placeholder="Расскажите немного о желаемой съёмке..."
            ></textarea>

        </div>


        <div
            class="message"
            id="message"
        ></div>


        <button
            class="submit-button"
            id="submitButton"
            type="submit"
        >

            Отправить заявку

        </button>


    </form>


    <div class="system-message">

        <span class="system-line"></span>

        камера готова • ожидание заявки

        <span class="system-line"></span>

    </div>


    <div class="brand">

        CAMERA / READY

    </div>

</main>


<!-- ПЕРЕХОД -->

<div
    class="transition"
    id="transition"
>

    <div class="transition-content">

        <div class="loader">

            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-dot"></div>

        </div>

        <div class="transition-title">

            Отправляем заявку...

        </div>

        <div class="transition-sub">

            Соединение с фотографом

        </div>

        <div class="loading-line"></div>

    </div>

</div>


<script>

/* =========================================================
   НАСТРОЙКА
========================================================= */

/*
   СЮДА ПОСЛЕ СОЗДАНИЯ CLOUDFLARE WORKER
   ВСТАВЬ ЕГО URL.

   Например:

   https://niksart-booking.имя.workers.dev
*/

const WORKER_URL =
    "ВСТАВЬ_СЮДА_URL_CLOUDFLARE_WORKER";


/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const form =
    document.getElementById("bookingForm");

const dateInput =
    document.getElementById("date");

const timeInput =
    document.getElementById("time");

const timeGrid =
    document.getElementById("timeGrid");

const message =
    document.getElementById("message");

const submitButton =
    document.getElementById("submitButton");

const transition =
    document.getElementById("transition");

const colorFlash =
    document.getElementById("colorFlash");


/* =========================================================
   МИНИМАЛЬНАЯ ДАТА
========================================================= */

const today =
    new Date();

const year =
    today.getFullYear();

const month =
    String(today.getMonth() + 1)
        .padStart(2, "0");

const day =
    String(today.getDate())
        .padStart(2, "0");

dateInput.min =
    `${year}-${month}-${day}`;


/* =========================================================
   ВРЕМЯ
========================================================= */

/*

   11:20 → 11:40 → 12:00 → ...

   шаг: 20 минут

   последнее:
   17:00

*/

function createTimeSlots() {

    timeGrid.innerHTML = "";

    const start =
        11 * 60 + 20;

    const end =
        17 * 60;

    for (
        let minutes = start;
        minutes <= end;
        minutes += 20
    ) {

        const hours =
            Math.floor(minutes / 60);

        const mins =
            minutes % 60;

        const value =
            String(hours).padStart(2, "0")
            + ":"
            + String(mins).padStart(2, "0");


        const button =
            document.createElement("button");

        button.type =
            "button";

        button.className =
            "time-button";

        button.textContent =
            value;


        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".time-button")
                    .forEach(btn => {

                        btn.classList.remove(
                            "selected"
                        );

                    });


                button.classList.add(
                    "selected"
                );


                timeInput.value =
                    value;

            }
        );


        timeGrid.appendChild(
            button
        );
    }
}

createTimeSlots();


/* =========================================================
   КРАСНЫЙ РЕЖИМ
========================================================= */

setTimeout(() => {

    document.body.classList.add(
        "red-mode"
    );

    colorFlash.classList.add(
        "active"
    );

    setTimeout(() => {

        colorFlash.classList.remove(
            "active"
        );

    }, 500);

}, 2200);


/* =========================================================
   СООБЩЕНИЕ
========================================================= */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message show " + type;
}


/* =========================================================
   ОТПРАВКА
========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.className =
            "message";


        /* Проверяем URL */

        if (
            WORKER_URL.includes(
                "ВСТАВЬ_СЮДА"
            )
        ) {

            showMessage(
                "Сначала подключите Cloudflare Worker.",
                "error"
            );

            return;
        }


        /* Проверяем время */

        if (!timeInput.value) {

            showMessage(
                "Выберите удобное время съёмки.",
                "error"
            );

            return;
        }


        const data = {

            name:
                document
                    .getElementById("name")
                    .value
                    .trim(),

            telegram:
                document
                    .getElementById("telegram")
                    .value
                    .trim(),

            date:
                dateInput.value,

            time:
                timeInput.value,

            comment:
                document
                    .getElementById("comment")
                    .value
                    .trim()

        };


        if (!data.name) {

            showMessage(
                "Введите ваше имя.",
                "error"
            );

            return;
        }


        if (!data.telegram) {

            showMessage(
                "Укажите Telegram или другой контакт.",
                "error"
            );

            return;
        }


        /* Блокируем кнопку */

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Отправляем...";


        try {

            const response =
                await fetch(
                    WORKER_URL,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                data
                            )

                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.error ||
                    "Ошибка отправки"
                );

            }


            /* Переход */

            transition.classList.add(
                "active"
            );


            setTimeout(() => {

                transition.querySelector(
                    ".transition-title"
                ).textContent =
                    "Заявка отправлена!";

                transition.querySelector(
                    ".transition-sub"
                ).textContent =
                    "Фотограф получил вашу заявку";

            }, 900);


            setTimeout(() => {

                transition.classList.remove(
                    "active"
                );

                form.reset();

                timeInput.value =
                    "";

                document
                    .querySelectorAll(
                        ".time-button"
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            "selected"
                        );

                    });

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Отправить заявку";

            }, 2800);


        } catch (error) {

            console.error(error);


            showMessage(
                "Не удалось отправить заявку. Попробуйте ещё раз.",
                "error"
            );


            submitButton.disabled =
                false;

            submitButton.textContent =
                "Отправить заявку";

        }

    }
);

</script>

</body>
</html>
