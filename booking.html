<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Запись на съёмку</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #030303;
            color: #fff;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        /* =========================
           ФОН
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .glow {
            position: absolute;

            width: 520px;
            height: 520px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 166, 0, 0.14),
                    rgba(255, 166, 0, 0.04) 35%,
                    transparent 70%
                );

            filter: blur(30px);

            animation: moveGlow 12s ease-in-out infinite alternate;
        }

        .glow.one {
            left: -280px;
            top: -260px;
        }

        .glow.two {
            right: -280px;
            bottom: -280px;

            animation-delay: -5s;
            animation-duration: 15s;
        }

        @keyframes moveGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(100px, 80px) scale(1.15);
            }

            100% {
                transform: translate(-40px, 120px) scale(.9);
            }
        }

        /* =========================
           ЗОЛОТОЙ ЛУЧ
        ========================= */

        .beam {
            position: fixed;

            top: -100%;
            left: -70%;

            width: 55%;
            height: 230%;

            transform: rotate(25deg);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 174, 0, 0.02),
                    rgba(255, 190, 60, 0.12),
                    rgba(255, 174, 0, 0.02),
                    transparent
                );

            filter: blur(25px);

            pointer-events: none;

            animation: beam 8s ease-in-out infinite;
        }

        @keyframes beam {
            0% {
                left: -70%;
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            50% {
                left: 115%;
                opacity: 1;
            }

            65% {
                opacity: 0;
            }

            100% {
                left: 115%;
                opacity: 0;
            }
        }

        /* =========================
           ЧАСТИЦЫ
        ========================= */

        .particles {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }

        .particle {
            position: absolute;

            bottom: -10px;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #ffb52e;

            box-shadow:
                0 0 8px #ffb52e,
                0 0 18px rgba(255, 181, 46, .5);

            opacity: 0;

            animation: particle 7s linear infinite;
        }

        .particle:nth-child(1) {
            left: 7%;
            animation-delay: 0s;
            animation-duration: 7s;
        }

        .particle:nth-child(2) {
            left: 17%;
            animation-delay: 1.5s;
            animation-duration: 9s;
        }

        .particle:nth-child(3) {
            left: 28%;
            animation-delay: 3s;
            animation-duration: 8s;
        }

        .particle:nth-child(4) {
            left: 40%;
            animation-delay: .7s;
            animation-duration: 10s;
        }

        .particle:nth-child(5) {
            left: 52%;
            animation-delay: 2.4s;
            animation-duration: 7.5s;
        }

        .particle:nth-child(6) {
            left: 64%;
            animation-delay: 4s;
            animation-duration: 9s;
        }

        .particle:nth-child(7) {
            left: 76%;
            animation-delay: 1.8s;
            animation-duration: 8.5s;
        }

        .particle:nth-child(8) {
            left: 89%;
            animation-delay: 3.5s;
            animation-duration: 7s;
        }

        .particle:nth-child(9) {
            left: 95%;
            animation-delay: 5s;
            animation-duration: 10s;
        }

        @keyframes particle {
            0% {
                transform:
                    translateY(0)
                    translateX(0)
                    scale(.2);

                opacity: 0;
            }

            12% {
                opacity: .8;
            }

            50% {
                opacity: .5;
            }

            100% {
                transform:
                    translateY(-110vh)
                    translateX(50px)
                    scale(1);

                opacity: 0;
            }
        }

        /* =========================
           ОСНОВНОЙ БЛОК
        ========================= */

        .container {
            position: relative;
            z-index: 10;

            width: min(650px, calc(100% - 32px));

            text-align: center;

            animation:
                appear 1.2s
                cubic-bezier(.16, 1, .3, 1)
                forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(.94);

                filter: blur(12px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter: blur(0);
            }
        }

        /* =========================
           ИКОНКА
        ========================= */

        .icon-wrap {
            position: relative;

            width: 100px;
            height: 100px;

            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon {
            position: relative;
            z-index: 3;

            width: 70px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            border: 1px solid rgba(255, 181, 46, .5);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 181, 46, .1),
                    transparent 70%
                );

            color: #ffb52e;

            font-size: 27px;

            box-shadow:
                0 0 35px rgba(255, 166, 0, .13),
                inset 0 0 25px rgba(255, 166, 0, .05);

            animation: float 3.5s ease-in-out infinite;
        }

        .ring {
            position: absolute;

            inset: 10px;

            border-radius: 50%;

            border: 1px solid rgba(255, 174, 0, .25);

            animation: ring 3s ease-out infinite;
        }

        .ring:nth-child(2) {
            animation-delay: 1.5s;
        }

        @keyframes ring {
            0% {
                transform: scale(.7);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: scale(1.45);
                opacity: 0;
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-7px) rotate(4deg);
            }
        }

        /* =========================
           ЗАГОЛОВОК
        ========================= */

        h1 {
            font-size: clamp(30px, 6vw, 50px);

            line-height: 1.05;

            font-weight: 850;

            letter-spacing: -2px;

            margin-bottom: 20px;

            background:
                linear-gradient(
                    110deg,
                    #ffffff 5%,
                    #ffffff 25%,
                    #ffd36a 42%,
                    #e99b00 50%,
                    #ffd36a 58%,
                    #ffffff 75%,
                    #ffffff 95%
                );

            background-size: 250% 100%;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation: shine 5s ease-in-out infinite;
        }

        @keyframes shine {
            0% {
                background-position: 200% center;
            }

            50% {
                background-position: 0 center;
            }

            100% {
                background-position: 200% center;
            }
        }

        /* =========================
           ТЕКСТ
        ========================= */

        p {
            max-width: 500px;

            margin: 0 auto;

            color: #999;

            font-size: 16px;

            line-height: 1.75;

            animation: textAppear 1s .45s both;
        }

        @keyframes textAppear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           ЛИНИЯ
        ========================= */

        .line {
            position: relative;

            width: 100px;
            height: 2px;

            margin: 32px auto 0;

            overflow: hidden;

            border-radius: 10px;

            background: rgba(255, 174, 0, .12);
        }

        .line::after {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ffb52e,
                    transparent
                );

            animation: line 2.5s ease-in-out infinite;
        }

        @keyframes line {
            0% {
                left: -100%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }

        /* =========================
           КНОПКА ЛИЧНЫХ СООБЩЕНИЙ
        ========================= */

        .contact-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            margin-top: 28px;

            padding: 14px 25px;

            border: 1px solid rgba(255, 181, 46, .45);

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 181, 46, .12),
                    rgba(255, 181, 46, .04)
                );

            color: #ffb52e;

            font-size: 15px;
            font-weight: 650;

            text-decoration: none;

            box-shadow:
                0 0 25px rgba(255, 166, 0, .08),
                inset 0 0 20px rgba(255, 166, 0, .03);

            transition:
                transform .25s ease,
                background .25s ease,
                box-shadow .25s ease,
                border-color .25s ease;
        }

        .contact-btn:hover {
            transform: translateY(-3px);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 181, 46, .2),
                    rgba(255, 181, 46, .07)
                );

            border-color: rgba(255, 181, 46, .75);

            box-shadow:
                0 8px 35px rgba(255, 166, 0, .18),
                inset 0 0 25px rgba(255, 166, 0, .05);
        }

        .contact-btn:active {
            transform: scale(.96);
        }

        .telegram-icon {
            font-size: 18px;
        }

        /* =========================
           НИЖНЯЯ НАДПИСЬ
        ========================= */

        .brand {
            margin-top: 40px;

            color: #444;

            font-size: 10px;

            letter-spacing: 5px;

            text-transform: uppercase;

            animation: brand 1s .8s both;
        }

        @keyframes brand {
            from {
                opacity: 0;
                letter-spacing: 1px;
            }

            to {
                opacity: 1;
                letter-spacing: 5px;
            }
        }

        /* =========================
           МОБИЛЬНАЯ ВЕРСИЯ
        ========================= */

        @media (max-width: 500px) {

            .container {
                width: calc(100% - 28px);
            }

            .icon-wrap {
                width: 80px;
                height: 80px;

                margin-bottom: 25px;
            }

            .icon {
                width: 60px;
                height: 60px;

                font-size: 23px;
            }

            h1 {
                font-size: 30px;
                letter-spacing: -1.2px;
            }

            p {
                font-size: 15px;
                line-height: 1.65;
            }

            .contact-btn {
                margin-top: 24px;

                padding: 13px 21px;

                font-size: 14px;
            }

            .brand {
                margin-top: 32px;
            }
        }

        /* =========================
           ЕСЛИ АНИМАЦИИ ОТКЛЮЧЕНЫ
        ========================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <!-- Фоновое свечение -->
    <div class="background">
        <div class="glow one"></div>
        <div class="glow two"></div>
    </div>

    <!-- Золотой луч -->
    <div class="beam"></div>

    <!-- Частицы -->
    <div class="particles">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <!-- Основной блок -->
    <main class="container">

        <!-- Иконка -->
        <div class="icon-wrap">

            <div class="ring"></div>
            <div class="ring"></div>

            <div class="icon">
                ⏳
            </div>

        </div>

        <!-- Заголовок -->
        <h1>
            Запись через сайт<br>
            временно недоступна
        </h1>

        <!-- Описание -->
        <p>
            В данный момент запись через сайт временно недоступна.
            Если вы хотите записаться на съёмку,
            напишите мне в личные сообщения.
        </p>

        <!-- Линия -->
        <div class="line"></div>

        <!-- Кнопка -->
        <a
            class="contact-btn"
            href="https://t.me/tylenevv"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="telegram-icon">✈</span>
            Написать мне в личные сообщения
        </a>

        <!-- Бренд -->
        <div class="brand">
            Съёмка
        </div>

    </main>

</body>
</html>
