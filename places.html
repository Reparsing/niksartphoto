<!DOCTYPE html>
<html lang="ru" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршруты — Никс</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===== */
        :root {
            --kumo-brand: #fbbf24;
            --kumo-brand-glow: rgba(251, 191, 36, 0.3);
            --kumo-brand-subtle: rgba(251, 191, 36, 0.12);
            --kumo-canvas: #0a0a0c;
            --kumo-hairline: rgba(255, 255, 255, 0.08);
            --kumo-subtle: #a1a1aa;
            --kumo-muted: #71717a;
            --kumo-default: #f4f4f5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--kumo-canvas);
            color: var(--kumo-default);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== ФОН С ПАРЯЩИМИ ФИГУРАМИ ===== */
        .bg-shapes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.05;
            will-change: transform;
            animation: floatShape 30s infinite alternate ease-in-out;
        }
        .shape:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #fbbf24, transparent 70%);
            top: -20%;
            left: -15%;
            animation-duration: 35s;
        }
        .shape:nth-child(2) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #f59e0b, transparent 70%);
            bottom: -15%;
            right: -15%;
            animation-duration: 40s;
            animation-delay: -10s;
        }
        .shape:nth-child(3) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #fcd34d, transparent 70%);
            top: 50%;
            left: 50%;
            animation-duration: 32s;
            animation-delay: -18s;
        }
        @keyframes floatShape {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(80px, -50px) scale(1.2) rotate(30deg); }
            66% { transform: translate(-40px, 60px) scale(0.8) rotate(-25deg); }
            100% { transform: translate(50px, -40px) scale(1.1) rotate(20deg); }
        }

        /* ===== ЧАСТИЦЫ ===== */
        #particles-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================
                   КОНТЕЙНЕР С КАМЕРОЙ
                   ============================================ */
        .camera-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* ===== ХВОСТ (радужный след) ===== */
        .trail-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trail {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #ff6b6b,
                #feca57,
                #48dbfb,
                #ff9ff3,
                #54a0ff,
                #5f27cd,
                #ff6b6b
            );
            opacity: 0.3;
            filter: blur(8px);
            animation: trailSpin 6s linear infinite;
            width: 100%;
            height: 100%;
        }

        .trail-inner {
            position: absolute;
            inset: 15%;
            border-radius: 50%;
            background: var(--kumo-canvas);
            z-index: 1;
        }

        @keyframes trailSpin {
            0% { transform: rotate(0deg) scale(0.8); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(0.8); }
        }

        /* ===== КАМЕРА (Blink-анимация) ===== */
        .camera-icon {
            position: relative;
            z-index: 2;
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.5));
            animation: cameraBlink 2.4s ease-in-out infinite;
            will-change: transform;
            display: block;
        }

        @keyframes cameraBlink {
            0% {
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.3));
            }
            25% {
                transform: scale(0.85) rotate(-6deg);
                filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.6));
            }
            50% {
                transform: scale(1.15) rotate(6deg);
                filter: drop-shadow(0 0 60px rgba(251, 191, 36, 0.8));
            }
            75% {
                transform: scale(0.9) rotate(-3deg);
                filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.5));
            }
            100% {
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.3));
            }
        }

        /* ===== ИНФОРМАЦИЯ: СКОРОСТЬ 4 км/ч ===== */
        .speed-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            border-radius: 40px;
            background: rgba(18, 18, 22, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--kumo-hairline);
            font-size: 1rem;
            font-weight: 600;
            color: var(--kumo-subtle);
            animation: fadeUp 1s ease 0.5s both;
        }
        .speed-info .speed-value {
            color: var(--kumo-brand);
            font-size: 1.2rem;
        }
        .speed-info .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: blinkDot 1.5s infinite;
        }
        @keyframes blinkDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
                   НАВИГАЦИЯ
                   ============================================ */
        .kumo-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 12, 0.7);
            border-bottom: 1px solid var(--kumo-hairline);
            padding: 12px 0;
            pointer-events: auto;
        }
        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .kumo-brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
            color: #fff;
        }
        .kumo-brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--kumo-brand-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--kumo-brand);
            font-size: 1.2rem;
        }
        .kumo-nav-menu {
            display: none;
            list-style: none;
            gap: 32px;
        }
        @media (min-width: 768px) {
            .kumo-nav-menu { display: flex; }
        }
        .kumo-nav-link {
            color: var(--kumo-subtle);
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
            padding: 4px 0;
        }
        .kumo-nav-link:hover { color: #fff; }
        .kumo-nav-link.active {
            color: var(--kumo-brand);
            font-weight: 600;
        }
        .kumo-nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--kumo-brand);
            border-radius: 2px;
            box-shadow: 0 0 20px var(--kumo-brand-glow);
        }
        .kumo-mobile-toggle {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
        }
        @media (min-width: 768px) {
            .kumo-mobile-toggle { display: none; }
        }

        /* ===== МОБИЛЬНОЕ МЕНЮ ===== */
        .mobile-menu {
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 20px 0;
            background: rgba(10,10,12,0.96);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--kumo-hairline);
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            z-index: 999;
        }
        .mobile-menu.open { display: flex; }
        .mobile-menu a {
            color: var(--kumo-subtle);
            font-size: 1rem;
            font-weight: 500;
            padding: 6px 24px;
            transition: color 0.3s;
        }
        .mobile-menu a:hover { color: #fff; }
        .mobile-menu a.active { color: var(--kumo-brand); }
        @media (min-width: 768px) {
            .mobile-menu { display: none !important; }
        }

        /* ===== ПОДПИСЬ ===== */
        .label {
            color: var(--kumo-muted);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: 8px;
            animation: fadeUp 1s ease 0.8s both;
        }

        /* ===== КНОПКА НАЗАД ===== */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #0a0a0c;
            background: var(--kumo-brand);
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
            animation: fadeUp 1s ease 1s both;
        }
        .btn-back:hover {
            transform: scale(1.06);
            box-shadow: 0 0 60px var(--kumo-brand-glow);
        }

        /* ============================================
                   АДАПТИВ
                   ============================================ */
        @media (max-width: 768px) {
            .camera-icon { width: 60px; height: 60px; }
            .trail-wrapper { width: 160px; height: 160px; }
            .speed-info { font-size: 0.85rem; padding: 8px 16px; }
        }
        @media (max-width: 480px) {
            .camera-icon { width: 48px; height: 48px; }
            .trail-wrapper { width: 130px; height: 130px; }
            .speed-info { font-size: 0.75rem; padding: 6px 14px; }
        }
    </style>
</head>
<body>

    <!-- ============================================
    СКРИПТЫ
    ============================================ -->

    <!-- 1. ЧАСТИЦЫ -->
    <script>
        (function() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const COUNT = 100;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.4;
                    this.opacity = Math.random() * 0.4 + 0.15;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(251, 191, 36, ${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < COUNT; i++) particles.push(new Particle());

            let mouseX = null, mouseY = null;
            canvas.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            canvas.addEventListener('mouseleave', () => {
                mouseX = null;
                mouseY = null;
            });

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    if (mouseX !== null && mouseY !== null) {
                        const dx = p.x - mouseX;
                        const dy = p.y - mouseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 180) {
                            const force = (180 - dist) / 180 * 0.03;
                            p.x += dx * force;
                            p.y += dy * force;
                        }
                    }
                    p.update();
                    p.draw();
                });

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 130) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(251, 191, 36, ${0.06 * (1 - dist/130)})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>

    <!-- 2. МОБИЛЬНОЕ МЕНЮ -->
    <script>
