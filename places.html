<!DOCTYPE html>
<html lang="ru" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скоро — Никс</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===== */
        :root {
            --kumo-brand: #fbbf24;
            --kumo-brand-glow: rgba(251, 191, 36, 0.3);
            --kumo-brand-subtle: rgba(251, 191, 36, 0.12);
            --kumo-canvas: #0a0a0c;
            --kumo-hairline: rgba(255, 255, 255, 0.08);
            --kumo-subtle: #a1a1aa;
            --kumo-muted: #71717a;
            --kumo-default: #f4f4f5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--kumo-canvas);
            color: var(--kumo-default);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== ФОН С ПАРЯЩИМИ ФИГУРАМИ ===== */
        .bg-shapes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.05;
            will-change: transform;
            animation: floatShape 30s infinite alternate ease-in-out;
        }
        .shape:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #fbbf24, transparent 70%);
            top: -20%;
            left: -15%;
            animation-duration: 35s;
        }
        .shape:nth-child(2) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #f59e0b, transparent 70%);
            bottom: -15%;
            right: -15%;
            animation-duration: 40s;
            animation-delay: -10s;
        }
        .shape:nth-child(3) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #fcd34d, transparent 70%);
            top: 50%;
            left: 50%;
            animation-duration: 32s;
            animation-delay: -18s;
        }
        @keyframes floatShape {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(80px, -50px) scale(1.2) rotate(30deg); }
            66% { transform: translate(-40px, 60px) scale(0.8) rotate(-25deg); }
            100% { transform: translate(50px, -40px) scale(1.1) rotate(20deg); }
        }

        /* ===== ЧАСТИЦЫ (canvas) ===== */
        #particles-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
            padding: 40px 24px;
            animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== ИКОНКА ===== */
        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--kumo-brand-subtle);
            border: 1px solid rgba(251, 191, 36, 0.2);
            margin-bottom: 32px;
            animation: pulseIcon 2.5s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(251, 191, 36, 0.05);
        }
        .icon-wrapper .icon {
            font-size: 3.6rem;
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-12px) rotate(4deg); }
        }
        @keyframes pulseIcon {
            0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.05); }
            50% { box-shadow: 0 0 60px rgba(251, 191, 36, 0.15); }
        }

        /* ===== ЗАГОЛОВОК ===== */
        .title {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        @media (max-width: 768px) {
            .title { font-size: 2.4rem; }
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--kumo-subtle);
            margin-bottom: 24px;
            font-weight: 400;
        }

        /* ===== СТРОКА "СКОРО" ===== */
        .soon-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 24px;
            border-radius: 60px;
            background: var(--kumo-brand-subtle);
            border: 1px solid rgba(251, 191, 36, 0.2);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--kumo-brand);
            margin-bottom: 28px;
        }
        .soon-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--kumo-brand);
            animation: blinkDot 1.2s infinite;
        }
        @keyframes blinkDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }

        /* ===== ТЕКСТ ===== */
        .description {
            color: var(--kumo-muted);
            font-size: 1rem;
            line-height: 1.8;
            max-width: 440px;
            margin: 0 auto 32px;
        }

        /* ===== КНОПКА НАЗАД ===== */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #0a0a0c;
            background: var(--kumo-brand);
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
        }
        .btn-back:hover {
            transform: scale(1.06);
            box-shadow: 0 0 60px var(--kumo-brand-glow);
        }
        .btn-back:active {
            transform: scale(0.94);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            .title { font-size: 2rem; }
            .subtitle { font-size: 1rem; }
            .icon-wrapper { width: 80px; height: 80px; }
            .icon-wrapper .icon { font-size: 2.8rem; }
            .description { font-size: 0.9rem; }
            .btn-back { padding: 12px 24px; font-size: 0.85rem; }
            .soon-badge { font-size: 0.75rem; padding: 6px 16px; }
        }
    </style>
</head>
<body>

    <!-- ===== ФОН: ПАРЯЩИЕ ФИГУРЫ ===== -->
    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- ===== ФОН: ЧАСТИЦЫ ===== -->
    <canvas id="particles-canvas"></canvas>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <div class="content">

        <div class="icon-wrapper">
            <span class="icon">🗺️</span>
        </div>

        <div class="soon-badge">
            <span class="dot"></span>
            Скоро будет доступно
        </div>

        <h1 class="title">Маршруты<br>любимых мест</h1>
        <p class="subtitle">Карта с анимированным фотоаппаратом</p>

        <p class="description">
            Я работаю над интерактивной картой Калининграда,<br>
            где ты сможешь увидеть мои любимые места<br>
            и маршруты в реальном времени.
        </p>

        <a href="index.html" class="btn-back">
            ← Вернуться на главную
        </a>

    </div>

    <!-- ============================================
    СКРИПТЫ
    ============================================ -->

    <!-- 1. ЧАСТИЦЫ -->
    <script>
        (function() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const COUNT = 100;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.4;
                    this.opacity = Math.random() * 0.4 + 0.15;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(251, 191, 36, ${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < COUNT; i++) particles.push(new Particle());

            let mouseX = null,
                mouseY = null;
            canvas.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            canvas.addEventListener('mouseleave', () => {
                mouseX = null;
                mouseY = null;
            });

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    if (mouseX !== null && mouseY !== null) {
                        const dx = p.x - mouseX;
                        const dy = p.y - mouseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 180) {
                            const force = (180 - dist) / 180 * 0.03;
                            p.x += dx * force;
                            p.y += dy * force;
                        }
                    }
                    p.update();
                    p.draw();
                });

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 130) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(251, 191, 36, ${0.06 * (1 - dist/130)})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>

</body>
</html>
