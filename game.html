<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Небесный объектив</title>
    
    <!-- ПОДКЛЮЧАЕМ АУДИО -->
    <script>
        const backgroundMusic = new Audio('https://raw.githubusercontent.com/Reparsing/niksartphoto/main/media/Nero_s_Day_At_Disneyland_-_Sprawling_Idiot_Effigy_(SkySound7.com).mp3');
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.4; // Громкость 40%
    </script>

    <style>
        /* ===== СТИЛИ (ТЕ ЖЕ, ЧТО И РАНЬШЕ) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
            margin: 0;
        }
        .game-wrapper {
            background: #16161a;
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            max-width: 700px;
            width: 100%;
            position: relative;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f4f4f5;
            font-size: 1.2rem;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .game-header.show { opacity: 1; }
        .game-header .score-wrap { display: flex; align-items: center; gap: 16px; }
        .game-header span { color: #fbbf24; }
        .speed-indicator {
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 14px;
            border-radius: 30px;
            color: #a1a1aa;
            font-weight: 600;
            min-width: 80px;
            text-align: center;
        }
        .speed-indicator strong { color: #fbbf24; font-size: 1.2rem; }
        #gameCanvas {
            width: 100%;
            height: 500px;
            background: radial-gradient(ellipse at 30% 20%, #132a44, #0a1628);
            border-radius: 20px;
            display: block;
            cursor: none;
            touch-action: none;
            position: relative;
        }
        /* ===== МЕНЮ ===== */
        .menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 12, 0.3);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            transition: opacity 0.8s ease;
            pointer-events: auto;
        }
        .menu-overlay.hidden { opacity: 0; pointer-events: none; }
        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f4f4f5;
            padding: 14px 44px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.1);
            letter-spacing: 0.5px;
        }
        .btn:hover { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; transform: scale(1.05); box-shadow: 0 0 60px rgba(251, 191, 36, 0.3); }
        .btn-primary { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        .btn-primary:hover { background: #fcd34d; transform: scale(1.05); }
        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .game-controls.show { opacity: 1; }
        .btn-up, .btn-down {
            background: rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            padding: 8px 20px;
            min-width: 60px;
            font-size: 1.2rem;
        }
        .btn-up:hover, .btn-down:hover { background: #fbbf24; color: #0a0a0c; }
        .btn-sm { padding: 8px 18px; font-size: 0.9rem; }
        .menu-btn-home { margin-top: 12px; }
        
        /* ===== ОКНО ПРОИГРЫША ===== */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
            flex-direction: column;
            padding: 20px;
        }
        .overlay.show { display: flex; }
        .overlay-box {
            background: #1c1c22;
            padding: 40px 36px;
            border-radius: 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 320px;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        @keyframes popIn {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .overlay-box h2 { color: #f87171; font-size: 2.2rem; margin-bottom: 6px; font-weight: 800; }
        .overlay-box p { color: #a1a1aa; font-size: 1.1rem; margin-bottom: 20px; }
        .overlay-box p strong { color: #fbbf24; font-size: 1.4rem; }
        .overlay-box .btn { background: #f87171; border-color: #f87171; color: #0a0a0c; padding: 12px 36px; }
        .overlay-box .btn:hover { background: #fca5a5; border-color: #fca5a5; transform: scale(1.05); }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 500px) {
            .game-wrapper { padding: 12px; }
            #gameCanvas { height: 400px; }
            .game-header { font-size: 1rem; }
            .btn { padding: 10px 24px; font-size: 1rem; }
            .btn-up, .btn-down { padding: 6px 14px; min-width: 44px; font-size: 1rem; }
            .overlay-box { padding: 30px 24px; }
            .overlay-box h2 { font-size: 1.8rem; }
        }
        @media (max-width: 400px) {
            .btn { padding: 8px 16px; font-size: 0.8rem; }
            .btn-up, .btn-down { padding: 4px 10px; min-width: 36px; font-size: 0.8rem; }
            .overlay-box { padding: 24px 16px; }
            .overlay-box h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header" id="gameHeader">
            <div class="score-wrap">
                <div>📸 <span id="scoreDisplay">0</span></div>
                <div class="speed-indicator">⚡ <strong id="speedDisplay">0</strong> км/ч</div>
            </div>
            <div>🏆 <span id="bestDisplay">0</span></div>
        </div>

        <div style="position: relative;">
            <canvas id="gameCanvas" width="600" height="500"></canvas>

            <!-- МЕНЮ -->
            <div class="menu-overlay" id="menuOverlay">
                <div style="text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <button class="btn btn-primary" id="startGameBtn" style="font-size: 1.4rem; padding: 16px 56px;">🚀 Играть</button>
                    <a href="https://reparsing.github.io/niksartphoto/" class="btn menu-btn-home" style="font-size: 1rem; padding: 10px 32px;">🏠 На главную</a>
                </div>
            </div>

            <!-- ОКНО ПРОИГРЫША -->
            <div class="overlay" id="gameOverOverlay">
                <div class="overlay-box">
                    <h2>💥 Игра окончена</h2>
                    <p>Счёт: <strong id="finalScore">0</strong></p>
                    <button class="btn" id="restartFromOverlayBtn">🔄 Играть снова</button>
                </div>
            </div>
        </div>

        <div class="game-controls" id="gameControls">
            <button class="btn btn-up" id="upBtn">▲</button>
            <button class="btn btn-primary btn-sm" id="restartBtn">🔄 Заново</button>
            <button class="btn btn-sm" id="menuBtn" style="display: none;">📋 Меню</button>
            <button class="btn btn-down" id="downBtn">▼</button>
        </div>
    </div>

    <script>
        (function() {
            // ===== ИНИЦИАЛИЗАЦИЯ =====
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const bestSpan = document.getElementById('bestDisplay');
            const speedSpan = document.getElementById('speedDisplay');
            const finalScoreSpan = document.getElementById('finalScore');
            const menuOverlay = document.getElementById('menuOverlay');
            const startBtn = document.getElementById('startGameBtn');
            const restartBtn = document.getElementById('restartBtn');
            const restartOverlayBtn = document.getElementById('restartFromOverlayBtn');
            const menuBtn = document.getElementById('menuBtn');
            const overlay = document.getElementById('gameOverOverlay');
            const gameHeader = document.getElementById('gameHeader');
            const gameControls = document.getElementById('gameControls');

            const W = 600, H = 500;
            const cameraImg = new Image();
            cameraImg.crossOrigin = 'Anonymous';
            cameraImg.src = 'https://raw.githubusercontent.com/Reparsing/niksartphoto/main/images/camera.png';

            // ===== СОСТОЯНИЯ =====
            const STATE = { MENU: 0, TRANSITION: 1, PLAYING: 2, GAMEOVER: 3 };
            let gameState = STATE.MENU;
            let player = { x: W / 2, y: H / 2, vy: 0, radius: 28, pulsePhase: 0, speed: 3.0 };
            let stars = [], clouds = [];
            let score = 0;
            let bestScore = parseInt(localStorage.getItem('niksBestScore')) || 0;
            let gameActive = false;
            let frameId = null;
            let frameCount = 0;
            let transitionProgress = 0;
            const TRANSITION_DURATION = 60;
            const GRAVITY = 0.15, JUMP_FORCE = -0.5, MAX_SPEED = 8.0, FRICTION = 0.98;

            // ===== МУЗЫКА =====
            function playMusic() {
                backgroundMusic.play().catch(e => console.log('Автовоспроизведение заблокировано'));
            }
            function stopMusic() {
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
            }

            // ===== ИНИЦИАЛИЗАЦИЯ ИГРЫ =====
            function initGame() {
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.pulsePhase = 0;
                score = 0;
                gameActive = true;
                frameCount = 0;
                stars = [];
                clouds = [];
                gameState = STATE.PLAYING;
                overlay.classList.remove('show');
                gameHeader.classList.add('show');
                gameControls.classList.add('show');
                menuBtn.style.display = 'inline-block';
                updateUI();
                playMusic(); // Включаем музыку
            }

            // ===== СПАВН ОБЪЕКТОВ =====
            function spawnStar() {
                const y = 30 + Math.random() * (H - 60);
                stars.push({ x: W + 20, y, r: 12, speed: 1.5 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2 });
            }
            function spawnCloud() {
                const y = 30 + Math.random() * (H - 60);
                const size = 28 + Math.random() * 16;
                clouds.push({ x: W + 20, y, r: size, speed: 2.0 + Math.random() * 1.5, phase: Math.random() * Math.PI * 2 });
            }

            function updateUI() {
                scoreSpan.textContent = score;
                bestSpan.textContent = bestScore;
                speedSpan.textContent = Math.round(player.speed);
            }

            // ===== УПРАВЛЕНИЕ =====
            let upPressed = false, downPressed = false;
            ['upBtn', 'downBtn'].forEach(id => {
                const btn = document.getElementById(id);
                if (!btn) return;
                const start = (e) => { e.preventDefault(); if (id === 'upBtn') upPressed = true; else downPressed = true; };
                const end = (e) => { e.preventDefault(); upPressed = false; downPressed = false; };
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
                btn.addEventListener('mouseleave', end);
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end, { passive: false });
                btn.addEventListener('touchcancel', end);
            });

            // ===== ОБНОВЛЕНИЕ =====
            function update() {
                if (gameState === STATE.TRANSITION) {
                    transitionProgress++;
                    const t = transitionProgress / TRANSITION_DURATION;
                    const ease = 1 - Math.pow(1 - t, 3);
                    player.x = W / 2 + (80 - W / 2) * ease;
                    player.y = H / 2;
                    if (transitionProgress >= TRANSITION_DURATION) {
                        player.x = 80;
                        initGame();
                    }
                    return;
                }
                if (!gameActive || gameState !== STATE.PLAYING) return;
                frameCount++;
                if (upPressed) player.vy += JUMP_FORCE;
                if (downPressed) player.vy += GRAVITY * 0.8;
                player.vy += GRAVITY;
                player.vy *= FRICTION;
                player.y += player.vy;
                const margin = 30;
                if (player.y < margin) { player.y = margin; player.vy = 0; }
                if (player.y > H - margin) { player.y = H - margin; player.vy = 0; }
                player.pulsePhase += 0.05 * (player.speed / MAX_SPEED + 0.3);
                if (frameCount % 60 === 0 && player.speed < MAX_SPEED) player.speed += 0.05;
                if (frameCount % 35 === 0) spawnStar();
                if (frameCount % 55 === 0) spawnCloud();
                if (frameCount % 80 === 0 && frameCount > 100) spawnCloud();

                // Сбор звёзд
                for (let i = stars.length - 1; i >= 0; i--) {
                    const star = stars[i];
                    star.x -= star.speed * (player.speed / 3);
                    star.phase += 0.05;
                    const dx = player.x - star.x, dy = player.y - star.y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.radius + star.r) {
                        score++;
                        if (score > bestScore) { bestScore = score; localStorage.setItem('niksBestScore', bestScore); }
                        stars.splice(i, 1);
                        updateUI();
                        continue;
                    }
                    if (star.x < -20) stars.splice(i, 1);
                }

                // Столкновение с тучей
                for (let i = clouds.length - 1; i >= 0; i--) {
                    const cloud = clouds[i];
                    cloud.x -= cloud.speed * (player.speed / 3);
                    cloud.phase += 0.02;
                    const dx = player.x - cloud.x, dy = player.y - cloud.y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.radius + cloud.r) {
                        gameActive = false;
                        gameState = STATE.GAMEOVER;
                        finalScoreSpan.textContent = score;
                        overlay.classList.add('show');
                        gameControls.classList.remove('show');
                        stopMusic(); // Останавливаем музыку при проигрыше
                        return;
                    }
                    if (cloud.x < -40) clouds.splice(i, 1);
                }
                if (stars.length > 20) stars.splice(0, stars.length - 20);
                if (clouds.length > 15) clouds.splice(0, clouds.length - 15);
            }

            // ===== ОТРИСОВКА =====
            function draw() {
                ctx.clearRect(0, 0, W, H);
                // Шлейф
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER || gameState === STATE.TRANSITION) {
                    const trailLen = 18;
                    for (let i = 1; i < trailLen; i++) {
                        const alpha = 0.3 * (1 - i / trailLen) * (player.speed / MAX_SPEED + 0.3);
                        const hue = (i * 15 + Date.now() * 0.03) % 360;
                        const size = (1 - i / trailLen) * player.radius * 0.9;
                        const xOff = -i * 4, yOff = -player.vy * i * 0.5;
                        ctx.beginPath();
                        ctx.arc(player.x + xOff, player.y + yOff, size, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
                        ctx.fill();
                    }
                }
                // Звёзды и тучи
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
                    for (let star of stars) {
                        const pulse = 1 + 0.15 * Math.sin(star.phase);
                        const r = star.r * pulse;
                        const grad = ctx.createRadialGradient(star.x, star.y, 2, star.x, star.y, r * 2.5);
                        grad.addColorStop(0, '#fbbf24');
                        grad.addColorStop(0.5, 'rgba(251,191,36,0.3)');
                        grad.addColorStop(1, 'rgba(251,191,36,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, r * 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fcd34d';
                        ctx.shadowColor = '#fbbf24';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, r * 0.6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    for (let cloud of clouds) {
                        const pulse = 1 + 0.05 * Math.sin(cloud.phase);
                        const r = cloud.r * pulse;
                        ctx.fillStyle = 'rgba(180,190,200,0.4)';
                        ctx.shadowColor = 'rgba(180,190,200,0.1)';
                        ctx.shadowBlur = 30;
                        ctx.beginPath();
                        ctx.arc(cloud.x, cloud.y, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        for (let j = 0; j < 5; j++) {
                            const angle = j * 1.3 + cloud.phase;
                            const dx = Math.cos(angle) * r * 0.6, dy = Math.sin(angle) * r * 0.6;
                            ctx.beginPath();
                            ctx.arc(cloud.x + dx, cloud.y + dy, r * 0.4, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(200,210,220,0.2)';
                            ctx.fill();
                        }
                    }
                }
                // Камера
                const pulse = 1 + 0.06 * Math.sin(player.pulsePhase);
                const scaleX = pulse, scaleY = 1 / pulse;
                let drawX = player.x, drawY = player.y;
                if (gameState === STATE.MENU) { drawX = W / 2; drawY = H / 2; }
                if (cameraImg.complete && cameraImg.naturalWidth > 0) {
                    ctx.save();
                    ctx.translate(drawX, drawY);
                    const baseSize = gameState === STATE.MENU ? 100 : 70;
                    const sizeX = baseSize * scaleX * (1 + (player.speed / MAX_SPEED) * 0.05);
                    const sizeY = baseSize * scaleY * (1 + (player.speed / MAX_SPEED) * 0.05);
                    ctx.drawImage(cameraImg, -sizeX / 2, -sizeY / 2, sizeX, sizeY);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, player.radius * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#0a0a0c';
                    ctx.font = '32px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('📷', drawX, drawY + 2);
                }
                // Эффекты меню
                if (gameState === STATE.MENU) {
                    const time = Date.now() * 0.001;
                    for (let i = 0; i < 16; i++) {
                        const angle = i * (Math.PI / 8) + time * 0.3;
                        const radius = 100 + 20 * Math.sin(time * 0.5 + i);
                        const x = W / 2 + Math.cos(angle) * radius;
                        const y = H / 2 + Math.sin(angle) * radius * 0.5;
                        const alpha = 0.15 + 0.1 * Math.sin(time + i);
                        ctx.beginPath();
                        ctx.arc(x, y, 3 + 2 * Math.sin(time * 0.7 + i), 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(251, 191, 36, ${alpha})`;
                        ctx.fill();
                    }
                    for (let i = 0; i < 10; i++) {
                        const angle = i * (Math.PI / 5) + time * 0.2;
                        const x1 = W / 2 + Math.cos(angle) * 70;
                        const y1 = H / 2 + Math.sin(angle) * 35;
                        const x2 = W / 2 + Math.cos(angle + 0.15) * 130;
                        const y2 = H / 2 + Math.sin(angle + 0.15) * 65;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = `rgba(251, 191, 36, ${0.06 + 0.04 * Math.sin(time + i)})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '12px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(`⚡ ${Math.round(player.speed)} км/ч`, 12, H - 10);
                }
            }

            function gameLoop() {
                update();
                draw();
                frameId = requestAnimationFrame(gameLoop);
            }

            // ===== УПРАВЛЕНИЕ СОСТОЯНИЯМИ =====
            function startGame() {
                menuOverlay.classList.add('hidden');
                gameState = STATE.TRANSITION;
                transitionProgress = 0;
                player.x = W / 2;
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.pulsePhase = 0;
                gameActive = true;
                stars = [];
                clouds = [];
                score = 0;
                updateUI();
                gameHeader.classList.add('show');
                gameControls.classList.add('show');
                menuBtn.style.display = 'inline-block';
            }

            function goToMenu() {
                gameState = STATE.MENU;
                gameActive = false;
                overlay.classList.remove('show');
                menuOverlay.classList.remove('hidden');
                gameHeader.classList.remove('show');
                gameControls.classList.remove('show');
                menuBtn.style.display = 'none';
                stars = [];
                clouds = [];
                player.x = W / 2;
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                score = 0;
                updateUI();
                stopMusic(); // Останавливаем музыку при возврате в меню
            }

            function restartGame() {
                overlay.classList.remove('show');
                gameState = STATE.PLAYING;
                gameActive = true;
                player.x = 80;
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.pulsePhase = 0;
                score = 0;
                stars = [];
                clouds = [];
                frameCount = 0;
                gameControls.classList.add('show');
                updateUI();
                playMusic(); // Включаем музыку заново
            }

            // ===== ПОДКЛЮЧАЕМ КНОПКИ =====
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', restartGame);
            restartOverlayBtn.addEventListener('click', restartGame);
            menuBtn.addEventListener('click', goToMenu);

            // ===== ЗАПУСК =====
            gameState = STATE.MENU;
            player.x = W / 2;
            player.y = H / 2;
            bestSpan.textContent = bestScore;
            frameId = requestAnimationFrame(gameLoop);
            cameraImg.onerror = function() { console.warn('Картинка не загрузилась, используется эмодзи'); };
        })();
    </script>
</body>
</html>
