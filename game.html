<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Небесный объектив</title>
    <script>
        const backgroundMusic = new Audio('https://raw.githubusercontent.com/Reparsing/niksartphoto/main/media/Nero_s_Day_At_Disneyland_-_Sprawling_Idiot_Effigy_(SkySound7.com).mp3');
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.3;
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
        }
        .game-wrapper {
            background: #16161a;
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.06);
            max-width: 700px;
            width: 100%;
            position: relative;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            color: #f4f4f5;
            font-size: 1.2rem;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .game-header span { color: #fbbf24; }
        #gameCanvas {
            width: 100%;
            height: 500px;
            background: radial-gradient(ellipse at 30% 20%, #132a44, #0a1628);
            border-radius: 20px;
            display: block;
            touch-action: none;
            position: relative;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #f4f4f5;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        .btn-primary { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        .btn-sm { padding: 6px 16px; font-size: 0.8rem; }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.0);
            backdrop-filter: blur(0px);
            border-radius: 32px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .overlay.show {
            display: flex;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
        }
        .overlay-box {
            background: #1c1c22;
            padding: 40px 36px;
            border-radius: 28px;
            text-align: center;
            max-width: 340px;
            border: 1px solid rgba(255,255,255,0.08);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(0.8);
            opacity: 0;
        }
        .overlay.show .overlay-box {
            transform: scale(1);
            opacity: 1;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .overlay-box h2 { color: #f87171; font-size: 2.2rem; margin-bottom: 6px; }
        .overlay-box p { color: #a1a1aa; font-size: 1.1rem; margin-bottom: 20px; }
        .overlay-box p strong { color: #fbbf24; font-size: 1.4rem; }
        .overlay-box .btn { background: #f87171; border-color: #f87171; color: #0a0a0c; padding: 12px 32px; font-size: 1.1rem; }
        .overlay-box .btn:hover { background: #fca5a5; border-color: #fca5a5; transform: scale(1.05); }
        .menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10,10,12,0.5);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
        }
        .menu-overlay.hidden { display: none; }
        .menu-overlay h1 { color: #fff; font-size: 2.2rem; margin-bottom: 4px; }
        .menu-overlay h1 span { color: #fbbf24; }
        .menu-overlay p { color: #a1a1aa; margin-bottom: 16px; }
        .menu-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .menu-buttons .btn { font-size: 1rem; padding: 12px 24px; }
        @media (max-width: 500px) {
            .game-wrapper { padding: 12px; }
            #gameCanvas { height: 400px; }
            .overlay-box { padding: 30px 24px; }
            .overlay-box h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="game-header">
        <div>📸 <span id="scoreDisplay">0</span></div>
        <div>🏆 <span id="bestDisplay">0</span></div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="600" height="500"></canvas>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="menu-overlay" id="menuOverlay">
            <h1>Небесный <span>объектив</span></h1>
            <p>Управляй камерой пальцем или мышкой</p>
            <div class="menu-buttons">
                <button class="btn btn-primary" id="startBtn">🚀 Играть</button>
                <a href="https://reparsing.github.io/niksartphoto/" class="btn">🏠 На главную</a>
            </div>
        </div>

        <!-- ОКНО ПРОИГРЫША -->
        <div class="overlay" id="gameOverOverlay">
            <div class="overlay-box">
                <h2>💥 Игра окончена</h2>
                <p>Счёт: <strong id="finalScore">0</strong></p>
                <button class="btn" id="restartBtn">🔄 Играть снова</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <span style="color:#a1a1aa; font-size:0.9rem;">Управление: мышь / палец</span>
        <button class="btn btn-sm" id="menuBtn">📋 Меню</button>
    </div>
</div>

<script>
    (function() {
        // ===== ИНИЦИАЛИЗАЦИЯ =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const bestSpan = document.getElementById('bestDisplay');
        const finalScoreSpan = document.getElementById('finalScore');
        const menuOverlay = document.getElementById('menuOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const menuBtn = document.getElementById('menuBtn');

        const W = 600, H = 500;

        // ===== ЗАГРУЗКА КАРТИНКИ =====
        const cameraImg = new Image();
        cameraImg.crossOrigin = 'Anonymous';
        cameraImg.src = 'https://raw.githubusercontent.com/Reparsing/niksartphoto/main/images/camera.png';

        // ===== СОСТОЯНИЯ =====
        const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let gameState = STATE.MENU;
        let gameActive = false;
        let frameId = null;
        let frameCount = 0;

        // ===== ЖИЗНИ =====
        let lives = 3;
        const MAX_LIVES = 3;
        let heartParticles = [];
        let cameraExplosionParticles = [];

        // ===== УСКОРЕНИЕ ОТ ЗВЁЗД =====
        let speedMultiplier = 1.0;
        const SPEED_INCREMENT = 0.03;
        const MAX_SPEED_MULTIPLIER = 2.5;

        // ===== ИГРОК =====
        let player = {
            x: 120,
            y: H / 2,
            vy: 0,
            radius: 22,
            pulsePhase: 0,
            speed: 3.0,
            score: 0
        };

        let stars = [];
        let clouds = [];
        let bestScore = parseInt(localStorage.getItem('niksBestScore')) || 0;

        const GRAVITY = 0.15,
            FRICTION = 0.92;

        // ===== УПРАВЛЕНИЕ =====
        let targetY = player.y;

        // ===== ФУНКЦИИ МУЗЫКИ =====
        function playMusic() {
            backgroundMusic.play().catch(e => console.log('Автовоспроизведение заблокировано'));
        }
        function stopMusic() {
            backgroundMusic.pause();
            backgroundMusic.currentTime = 0;
        }

        // ===== АНИМАЦИЯ ВЗРЫВА КАМЕРЫ =====
        function spawnCameraExplosion(x, y) {
            // Создаём много осколков
            const colors = ['#fbbf24', '#f59e0b', '#ef4444', '#f472b6', '#60a5fa', '#34d399', '#fcd34d'];
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4;
                const size = 4 + Math.random() * 8;
                cameraExplosionParticles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    size: size,
                    life: 1.0,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.3,
                });
            }
            // Добавляем несколько крупных осколков
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 2;
                cameraExplosionParticles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.5,
                    size: 10 + Math.random() * 12,
                    life: 1.0,
                    color: '#fbbf24',
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.2,
                });
            }
        }

        function updateExplosionParticles() {
            // Обновляем осколки камеры
            for (let i = cameraExplosionParticles.length - 1; i >= 0; i--) {
                const p = cameraExplosionParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.03;
                p.rotation += p.rotSpeed;
                p.life -= 0.008;
                if (p.life <= 0) {
                    cameraExplosionParticles.splice(i, 1);
                }
            }
            // Обновляем осколки сердец
            for (let i = heartParticles.length - 1; i >= 0; i--) {
                const p = heartParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.rotation += p.rotSpeed;
                p.life -= 0.015;
                if (p.life <= 0) {
                    heartParticles.splice(i, 1);
                }
            }
        }

        function drawExplosionParticles() {
            // Рисуем осколки камеры
            for (let p of cameraExplosionParticles) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
            // Рисуем осколки сердец
            for (let p of heartParticles) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.globalAlpha = p.life;
                if (p.part === 'left') {
                    ctx.fillStyle = p.color || '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(-10, -10, 0, -18);
                    ctx.quadraticCurveTo(0, -10, 0, 0);
                    ctx.fill();
                } else if (p.part === 'right') {
                    ctx.fillStyle = p.color || '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(10, -10, 0, -18);
                    ctx.quadraticCurveTo(0, -10, 0, 0);
                    ctx.fill();
                } else {
                    ctx.fillStyle = p.color || '#ef4444';
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                ctx.globalAlpha = 1.0;
            }
        }

        // ===== АНИМАЦИЯ ПОТЕРИ СЕРДЦА =====
        function spawnHeartExplosion(x, y) {
            const half1 = {
                x: x, y: y,
                vx: -2 + Math.random() * 1.5,
                vy: -3 + Math.random() * 2,
                size: 16,
                life: 1.0,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.2,
                part: 'left',
                color: '#ef4444'
            };
            const half2 = {
                x: x, y: y,
                vx: 2 + Math.random() * 1.5,
                vy: -3 + Math.random() * 2,
                size: 16,
                life: 1.0,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.2,
                part: 'right',
                color: '#ef4444'
            };
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 2;
                heartParticles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    size: 4 + Math.random() * 4,
                    life: 1.0,
                    rotation: 0,
                    rotSpeed: (Math.random() - 0.5) * 0.3,
                    part: 'debris',
                    color: `hsl(0, 80%, ${50 + Math.random() * 30}%)`
                });
            }
            heartParticles.push(half1, half2);
        }

        // ===== ИНИЦИАЛИЗАЦИЯ ИГРЫ =====
        function initGame() {
            player.y = H / 2;
            player.vy = 0;
            player.speed = 3.0;
            player.pulsePhase = 0;
            player.score = 0;
            lives = MAX_LIVES;
            speedMultiplier = 1.0;
            heartParticles = [];
            cameraExplosionParticles = [];
            stars = [];
            clouds = [];
            frameCount = 0;
            gameActive = true;
            gameState = STATE.PLAYING;
            gameOverOverlay.classList.remove('show');
            gameOverOverlay.style.display = 'none';
            menuOverlay.classList.add('hidden');
            updateUI();
            playMusic();
        }

        function spawnStar() {
            const y = 30 + Math.random() * (H - 60);
            stars.push({ x: W + 20, y, r: 12, speed: 1.5 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2 });
        }

        function spawnCloud() {
            const y = 30 + Math.random() * (H - 60);
            const size = 28 + Math.random() * 16;
            clouds.push({ x: W + 20, y, r: size, speed: 2.0 + Math.random() * 1.5, phase: Math.random() * Math.PI * 2 });
        }

        function updateUI() {
            scoreSpan.textContent = player.score;
            bestSpan.textContent = bestScore;
        }

        // ===== ФУНКЦИЯ ЗАВЕРШЕНИЯ ИГРЫ =====
        function gameOver() {
            gameActive = false;
            gameState = STATE.GAMEOVER;
            finalScoreSpan.textContent = player.score;
            // Взрываем камеру
            spawnCameraExplosion(player.x, player.y);
            // Взрываем все оставшиеся сердца с задержкой
            let heartPositions = [];
            const heartSize = 24;
            const spacing = 10;
            const totalWidth = MAX_LIVES * heartSize + (MAX_LIVES - 1) * spacing;
            const startX = (W - totalWidth) / 2;
            for (let i = 0; i < lives; i++) {
                const x = startX + i * (heartSize + spacing);
                const y = 20 + heartSize * 0.3;
                heartPositions.push({ x, y, delay: i * 150 });
            }
            // Запускаем взрывы сердец с задержкой
            heartPositions.forEach((pos, index) => {
                setTimeout(() => {
                    spawnHeartExplosion(pos.x, pos.y);
                }, pos.delay);
            });
            // Показываем окно Game Over с задержкой
            setTimeout(() => {
                gameOverOverlay.style.display = 'flex';
                gameOverOverlay.classList.add('show');
                stopMusic();
            }, 600);
        }

        // ===== ОБНОВЛЕНИЕ ИГРЫ =====
        function update() {
            if (!gameActive) return;
            frameCount++;

            // ---- ПЛАВНОЕ СЛЕДОВАНИЕ ЗА КУРСОРОМ ----
            const diff = targetY - player.y;
            player.vy += diff * 0.008;
            player.vy *= FRICTION;
            player.y += player.vy;

            // ---- Границы ----
            const margin = 30;
            if (player.y < margin) { player.y = margin;
                player.vy = 0; }
            if (player.y > H - margin) { player.y = H - margin;
                player.vy = 0; }

            // ---- Пульсация ----
            player.pulsePhase += 0.05 * (player.speed / 8.0 + 0.3);

            // ---- Скорость и ускорение от звёзд ----
            const baseSpeed = 3.0;
            const maxBaseSpeed = 8.0;
            const currentMaxSpeed = Math.min(baseSpeed + (speedMultiplier - 1.0) * 2, maxBaseSpeed);
            if (player.speed < currentMaxSpeed) {
                player.speed += 0.02;
            }

            // ---- Спавн объектов ----
            const spawnRate = Math.max(25, 35 - speedMultiplier * 5);
            if (frameCount % Math.floor(spawnRate) === 0) spawnStar();
            if (frameCount % Math.floor(spawnRate * 1.6) === 0) spawnCloud();
            if (frameCount % Math.floor(spawnRate * 2.2) === 0 && frameCount > 100) spawnCloud();

            // ---- Сбор звёзд ----
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                star.x -= star.speed * (player.speed / 3) * speedMultiplier;
                star.phase += 0.05;

                const dx = player.x - star.x,
                    dy = player.y - star.y,
                    dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < player.radius + star.r) {
                    player.score++;
                    if (player.score > bestScore) {
                        bestScore = player.score;
                        localStorage.setItem('niksBestScore', bestScore);
                    }
                    speedMultiplier = Math.min(speedMultiplier + SPEED_INCREMENT, MAX_SPEED_MULTIPLIER);
                    stars.splice(i, 1);
                    updateUI();
                    continue;
                }

                if (star.x < -20) stars.splice(i, 1);
            }

            // ---- Столкновение с тучей ----
            for (let i = clouds.length - 1; i >= 0; i--) {
                const cloud = clouds[i];
                cloud.x -= cloud.speed * (player.speed / 3) * speedMultiplier;
                cloud.phase += 0.02;

                const dx = player.x - cloud.x,
                    dy = player.y - cloud.y,
                    dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < player.radius + cloud.r) {
                    lives--;
                    spawnHeartExplosion(player.x, player.y - 30);
                    clouds.splice(i, 1);

                    if (lives <= 0) {
                        gameOver();
                        return;
                    } else {
                        player.vy = -2;
                        continue;
                    }
                }

                if (cloud.x < -40) clouds.splice(i, 1);
            }

            // Обновление анимаций частиц
            updateExplosionParticles();

            if (stars.length > 25) stars.splice(0, stars.length - 25);
            if (clouds.length > 18) clouds.splice(0, clouds.length - 18);
        }

        // ===== ОТРИСОВКА =====
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Шлейф
            const trailLen = 14;
            for (let i = 1; i < trailLen; i++) {
                const alpha = 0.25 * (1 - i / trailLen) * (player.speed / 8.0 + 0.3);
                const hue = (i * 15 + Date.now() * 0.03) % 360;
                const size = (1 - i / trailLen) * player.radius * 0.9;
                const xOff = -i * 4,
                    yOff = -player.vy * i * 0.5;
                ctx.beginPath();
                ctx.arc(player.x + xOff, player.y + yOff, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
                ctx.fill();
            }

            // Звёзды
            for (let star of stars) {
                const pulse = 1 + 0.15 * Math.sin(star.phase);
                const r = star.r * pulse;
                const grad = ctx.createRadialGradient(star.x, star.y, 2, star.x, star.y, r * 2.5);
                grad.addColorStop(0, '#fbbf24');
                grad.addColorStop(0.5, 'rgba(251,191,36,0.3)');
                grad.addColorStop(1, 'rgba(251,191,36,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(star.x, star.y, r * 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fcd34d';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(star.x, star.y, r * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Тучи
            for (let cloud of clouds) {
                const pulse = 1 + 0.05 * Math.sin(cloud.phase);
                const r = cloud.r * pulse;
                ctx.fillStyle = 'rgba(180,190,200,0.4)';
                ctx.shadowColor = 'rgba(180,190,200,0.1)';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                for (let j = 0; j < 5; j++) {
                    const angle = j * 1.3 + cloud.phase;
                    const dx = Math.cos(angle) * r * 0.6,
                        dy = Math.sin(angle) * r * 0.6;
                    ctx.beginPath();
                    ctx.arc(cloud.x + dx, cloud.y + dy, r * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(200,210,220,0.2)';
                    ctx.fill();
                }
            }

            // Камера (если игра ещё не закончилась или частицы ещё летают)
            if (gameState !== STATE.GAMEOVER || cameraExplosionParticles.length > 0) {
                drawPlayer(player, '#fbbf24');
            }

            // ---- ОТОБРАЖЕНИЕ ЖИЗНЕЙ (если игра активна) ----
            if (gameState === STATE.PLAYING) {
                const heartSize = 24;
                const spacing = 10;
                const totalWidth = MAX_LIVES * heartSize + (MAX_LIVES - 1) * spacing;
                const startX = (W - totalWidth) / 2;
                for (let i = 0; i < lives; i++) {
                    const x = startX + i * (heartSize + spacing);
                    const y = 20;
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.moveTo(x, y + heartSize * 0.3);
                    ctx.bezierCurveTo(x - heartSize * 0.5, y - heartSize * 0.3, x - heartSize * 0.8, y + heartSize * 0.2, x, y + heartSize * 0.7);
                    ctx.bezierCurveTo(x + heartSize * 0.8, y + heartSize * 0.2, x + heartSize * 0.5, y - heartSize * 0.3, x, y + heartSize * 0.3);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // ---- ОТРИСОВКА ЧАСТИЦ ----
            drawExplosionParticles();

            // Спидометр
            if (gameState === STATE.PLAYING) {
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.font = '12px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`⚡ ${Math.round(player.speed)} км/ч`, 12, H - 10);
                ctx.fillText(`x${speedMultiplier.toFixed(1)}`, 120, H - 10);
            }
        }

        function drawPlayer(p, color) {
            const pulse = 1 + 0.06 * Math.sin(p.pulsePhase);
            const scaleX = pulse,
                scaleY = 1 / pulse;
            if (cameraImg.complete && cameraImg.naturalWidth > 0) {
                ctx.save();
                ctx.translate(p.x, p.y);
                const baseSize = 50;
                const sizeX = baseSize * scaleX * (1 + (p.speed / 8.0) * 0.05);
                const sizeY = baseSize * scaleY * (1 + (p.speed / 8.0) * 0.05);
                ctx.drawImage(cameraImg, -sizeX / 2, -sizeY / 2, sizeX, sizeY);
                ctx.restore();
            } else {
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * pulse, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#0a0a0c';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📷', p.x, p.y + 2);
            }
        }

        function gameLoop() {
            update();
            draw();
            frameId = requestAnimationFrame(gameLoop);
        }

        // ===== УПРАВЛЕНИЕ =====
        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== STATE.PLAYING) return;
            const rect = canvas.getBoundingClientRect();
            const scaleY = canvas.height / rect.height;
            targetY = (e.clientY - rect.top) * scaleY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameState !== STATE.PLAYING) return;
            const rect = canvas.getBoundingClientRect();
            const scaleY = canvas.height / rect.height;
            const touch = e.touches[0];
            if (touch) targetY = (touch.clientY - rect.top) * scaleY;
        }, { passive: false });

        // ===== КНОПКИ =====
        function startGame() {
            menuOverlay.classList.add('hidden');
            initGame();
        }

        startBtn.addEventListener('click', startGame);

        function restartGame() {
            // Плавно убираем оверлей
            gameOverOverlay.classList.remove('show');
            setTimeout(() => {
                gameOverOverlay.style.display = 'none';
                // Сбрасываем частицы
                cameraExplosionParticles = [];
                heartParticles = [];
                initGame();
            }, 400);
        }
        restartBtn.addEventListener('click', restartGame);

        function goToMenu() {
            gameActive = false;
            gameState = STATE.MENU;
            gameOverOverlay.classList.remove('show');
            gameOverOverlay.style.display = 'none';
            menuOverlay.classList.remove('hidden');
            stars = [];
            clouds = [];
            heartParticles = [];
            cameraExplosionParticles = [];
            player.score = 0;
            updateUI();
            stopMusic();
        }
        menuBtn.addEventListener('click', goToMenu);

        // ===== ЗАПУСК =====
        bestSpan.textContent = bestScore;
        frameId = requestAnimationFrame(gameLoop);
        cameraImg.onerror = function() { console.warn('Картинка не загрузилась'); };
    })();
</script>
</body>
</html>
