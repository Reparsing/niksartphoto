<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Небесный объектив</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
            margin: 0;
        }
        .game-wrapper {
            background: #16161a;
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            max-width: 700px;
            width: 100%;
            position: relative;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f4f4f5;
            font-size: 1.2rem;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .game-header .score-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .game-header span {
            color: #fbbf24;
        }
        .speed-indicator {
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 14px;
            border-radius: 30px;
            color: #a1a1aa;
            font-weight: 600;
            min-width: 80px;
            text-align: center;
        }
        .speed-indicator strong {
            color: #fbbf24;
            font-size: 1.2rem;
        }
        #gameCanvas {
            width: 100%;
            height: 500px;
            background: radial-gradient(ellipse at 30% 20%, #132a44, #0a1628);
            border-radius: 20px;
            display: block;
            cursor: none;
            touch-action: none;
            position: relative;
        }
        .menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 12, 0.5);
            backdrop-filter: blur(6px);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            transition: opacity 0.5s ease;
        }
        .menu-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .menu-title {
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
        }
        .menu-sub {
            color: #a1a1aa;
            font-size: 1rem;
            margin-bottom: 8px;
            text-align: center;
            max-width: 300px;
        }
        .menu-controls {
            color: #a1a1aa;
            font-size: 0.9rem;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.6;
        }
        .menu-controls strong {
            color: #fbbf24;
        }
        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f4f4f5;
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #fbbf24;
            color: #0a0a0c;
            border-color: #fbbf24;
            transform: scale(1.02);
        }
        .btn-primary {
            background: #fbbf24;
            color: #0a0a0c;
            border-color: #fbbf24;
        }
        .btn-up {
            background: rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            padding: 8px 16px;
            min-width: 60px;
        }
        .btn-up:hover {
            background: #fbbf24;
            color: #0a0a0c;
        }
        .btn-down {
            background: rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            padding: 8px 16px;
            min-width: 60px;
        }
        .btn-down:hover {
            background: #fbbf24;
            color: #0a0a0c;
        }
        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
            align-items: center;
        }
        .game-description {
            color: #a1a1aa;
            text-align: center;
            font-size: 0.9rem;
            margin: 12px 0 8px;
            letter-spacing: 0.3px;
        }
        .game-description strong {
            color: #fbbf24;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 32px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
            flex-direction: column;
            padding: 20px;
        }
        .overlay.show {
            display: flex;
        }
        .overlay-box {
            background: #1c1c22;
            padding: 40px 36px;
            border-radius: 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 320px;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .overlay-box h2 {
            color: #f87171;
            font-size: 2rem;
            margin-bottom: 6px;
        }
        .overlay-box p {
            color: #a1a1aa;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .overlay-box .btn {
            background: #f87171;
            border-color: #f87171;
            color: #0a0a0c;
        }
        .overlay-box .btn:hover {
            background: #fca5a5;
            border-color: #fca5a5;
        }

        @media (max-width: 500px) {
            .game-wrapper {
                padding: 12px;
            }
            #gameCanvas {
                height: 400px;
            }
            .game-header {
                font-size: 1rem;
            }
            .btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            .btn-up,
            .btn-down {
                padding: 6px 12px;
                min-width: 44px;
            }
            .game-controls {
                gap: 6px;
            }
            .menu-title {
                font-size: 1.6rem;
            }
        }
        @media (max-width: 400px) {
            .btn {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
            .btn-up,
            .btn-down {
                padding: 4px 10px;
                min-width: 36px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <div class="score-wrap">
                <div>📸 <span id="scoreDisplay">0</span></div>
                <div class="speed-indicator">⚡ <strong id="speedDisplay">0</strong> км/ч</div>
            </div>
            <div>🏆 <span id="bestDisplay">0</span></div>
        </div>
        <div style="position: relative;">
            <canvas id="gameCanvas" width="600" height="500"></canvas>
            <div class="menu-overlay" id="menuOverlay">
                <div style="text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <h1 class="menu-title">Небесный объектив</h1>
                    <p class="menu-sub">Давай поиграем!</p>
                    <div class="menu-controls">
                        Управляй кнопками <strong>▲</strong> и <strong>▼</strong><br />
                        Собирай <strong>звёзды</strong>, уворачивайся от <strong>туч</strong>
                    </div>
                    <button class="btn btn-primary" id="startGameBtn" style="font-size: 1.2rem; padding: 14px 44px;">🚀 Играть</button>
                    <a href="https://reparsing.github.io/niksartphoto/" class="btn" style="font-size: 1.2rem; padding: 14px 44px; margin-top: 10px;">🏠 На главную</a>
                </div>
            </div>
        </div>
        <div class="game-controls" id="gameControls">
            <button class="btn btn-up" id="upBtnGame">▲</button>
            <button class="btn btn-primary" id="restartBtn">🔄 Играть снова</button>
            <button class="btn" id="menuBtn" style="display: none;">📋 В меню</button>
            <button class="btn btn-down" id="downBtnGame">▼</button>
        </div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const bestSpan = document.getElementById('bestDisplay');
            const speedSpan = document.getElementById('speedDisplay');
            const finalScoreSpan = document.getElementById('finalScore');
            const menuOverlay = document.getElementById('menuOverlay');
            const startBtn = document.getElementById('startGameBtn');
            const restartBtn = document.getElementById('restartBtn');
            const menuBtn = document.getElementById('menuBtn');
            const overlay = document.querySelector('.overlay');
            const W = 600,
                H = 500;
            const cameraImg = new Image();
            cameraImg.crossOrigin = 'Anonymous';
            cameraImg.src = 'https://raw.githubusercontent.com/Reparsing/niksartphoto/main/images/camera.png';
            const STATE = { MENU: 0, TRANSITION: 1, PLAYING: 2, GAMEOVER: 3 };
            let gameState = STATE.MENU;
            let player = {
                x: W / 2,
                y: H / 2,
                vy: 0,
                radius: 28,
                pulsePhase: 0,
                speed: 3.0,
            };
            let stars = [];
            let clouds = [];
            let score = 0;
            let bestScore = parseInt(localStorage.getItem('niksBestScore')) || 0;
            let gameActive = false;
            let frameId = null;
            let frameCount = 0;
            let transitionProgress = 0;
            const TRANSITION_DURATION = 60;
            const GRAVITY = 0.15;
            const JUMP_FORCE = -0.5;
            const MAX_SPEED = 8.0;
            const FRICTION = 0.98;

            function initGame() {
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.pulsePhase = 0;
                score = 0;
                gameActive = true;
                frameCount = 0;
                stars = [];
                clouds = [];
                updateUI();
                menuBtn.style.display = 'inline-block';
                gameState = STATE.PLAYING;
            }

            function spawnStar() {
                const y = 30 + Math.random() * (H - 60);
                stars.push({ x: W + 20, y, r: 12, speed: 1.5 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2 });
            }

            function spawnCloud() {
                const y = 30 + Math.random() * (H - 60);
                const size = 28 + Math.random() * 16;
                clouds.push({ x: W + 20, y, r: size, speed: 2.0 + Math.random() * 1.5, phase: Math.random() * Math.PI *
                        2 });
            }

            function updateUI() {
                scoreSpan.textContent = score;
                bestSpan.textContent = bestScore;
                speedSpan.textContent = Math.round(player.speed);
            }

            let upPressed = false,
                downPressed = false;

            function setupButtons() {
                const btnIds = ['upBtnGame', 'downBtnGame'];
                btnIds.forEach(id => {
                    const btn = document.getElementById(id);
                    if (!btn) return;
                    const start = (e) => { e.preventDefault();
                        upPressed = (id === 'upBtnGame'); if (id === 'downBtnGame') downPressed = true; };
                    const end = (e) => { e.preventDefault();
                        upPressed = false;
                        downPressed = false; };
                    btn.addEventListener('mousedown', start);
                    btn.addEventListener('mouseup', end);
                    btn.addEventListener('mouseleave', end);
                    btn.addEventListener('touchstart', start, { passive: false });
                    btn.addEventListener('touchend', end, { passive: false });
                    btn.addEventListener('touchcancel', end);
                });
            }
            setupButtons();

            function update() {
                if (gameState === STATE.TRANSITION) {
                    transitionProgress++;
                    const t = transitionProgress / TRANSITION_DURATION;
                    const ease = 1 - Math.pow(1 - t, 3);
                    player.x = W / 2 + (80 - W / 2) * ease;
                    player.y = H / 2 + (H / 2 - H / 2) * ease;
                    if (transitionProgress >= TRANSITION_DURATION) {
                        gameState = STATE.PLAYING;
                        player.x = 80;
                        initGame();
                    }
                    return;
                }
                if (!gameActive || gameState !== STATE.PLAYING) return;
                frameCount++;
                if (upPressed) player.vy += JUMP_FORCE;
                if (downPressed) player.vy += GRAVITY * 0.8;
                player.vy += GRAVITY;
                player.vy *= FRICTION;
                player.y += player.vy;
                const margin = 30;
                if (player.y < margin) { player.y = margin;
                    player.vy = 0; }
                if (player.y > H - margin) { player.y = H - margin;
                    player.vy = 0; }
                player.pulsePhase += 0.05 * (player.speed / MAX_SPEED + 0.3);
                if (frameCount % 60 === 0 && player.speed < MAX_SPEED) player.speed += 0.05;
                if (frameCount % 35 === 0) spawnStar();
                if (frameCount % 55 === 0) spawnCloud();
                if (frameCount % 80 === 0 && frameCount > 100) spawnCloud();
                for (let i = stars.length - 1; i >= 0; i--) {
                    const star = stars[i];
                    star.x -= star.speed * (player.speed / 3);
                    star.phase += 0.05;
                    const dx = player.x - star.x,
                        dy = player.y - star.y,
                        dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.radius + star.r) {
                        score++;
                        if (score > bestScore) { bestScore = score;
                            localStorage.setItem('niksBestScore', bestScore); }
                        stars.splice(i, 1);
                        updateUI();
                        continue;
                    }
                    if (star.x < -20) stars.splice(i, 1);
                }
                for (let i = clouds.length - 1; i >= 0; i--) {
                    const cloud = clouds[i];
                    cloud.x -= cloud.speed * (player.speed / 3);
                    cloud.phase += 0.02;
                    const dx = player.x - cloud.x,
                        dy = player.y - cloud.y,
                        dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.radius + cloud.r) {
                        gameActive = false;
                        gameState = STATE.GAMEOVER;
                        finalScoreSpan.textContent = score;
                        document.querySelector('.overlay').classList.add('show');
                        return;
                    }
                    if (cloud.x < -40) clouds.splice(i, 1);
                }
                if (stars.length > 20) stars.splice(0, stars.length - 20);
                if (clouds.length > 15) clouds.splice(0, clouds.length - 15);
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER || gameState === STATE.TRANSITION) {
                    const trailLen = 18;
                    for (let i = 1; i < trailLen; i++) {
                        const alpha = 0.3 * (1 - i / trailLen) * (player.speed / MAX_SPEED + 0.3);
                        const hue = (i * 15 + Date.now() * 0.03) % 360;
                        const size = (1 - i / trailLen) * player.radius * 0.9;
                        const xOff = -i * 4,
                            yOff = -player.vy * i * 0.5;
                        ctx.beginPath();
                        ctx.arc(player.x + xOff, player.y + yOff, size, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
                        ctx.fill();
                    }
                }
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
                    for (let star of stars) {
                        const pulse = 1 + 0.15 * Math.sin(star.phase);
                        const r = star.r * pulse;
                        const grad = ctx.createRadialGradient(star.x, star.y, 2, star.x, star.y, r * 2.5);
                        grad.addColorStop(0, '#fbbf24');
                        grad.addColorStop(0.5, 'rgba(251,191,36,0.3)');
                        grad.addColorStop(1, 'rgba(251,191,36,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, r * 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fcd34d';
                        ctx.shadowColor = '#fbbf24';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, r * 0.6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    for (let cloud of clouds) {
                        const pulse = 1 + 0.05 * Math.sin(cloud.phase);
                        const r = cloud.r * pulse;
                        ctx.fillStyle = 'rgba(180,190,200,0.4)';
                        ctx.shadowColor = 'rgba(180,190,200,0.1)';
                        ctx.shadowBlur = 30;
                        ctx.beginPath();
                        ctx.arc(cloud.x, cloud.y, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        for (let j = 0; j < 5; j++) {
                            const angle = j * 1.3 + cloud.phase;
                            const dx = Math.cos(angle) * r * 0.6,
                                dy = Math.sin(angle) * r * 0.6;
                            ctx.beginPath();
                            ctx.arc(cloud.x + dx, cloud.y + dy, r * 0.4, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(200,210,220,0.2)';
                            ctx.fill();
                        }
                    }
                }
                const pulse = 1 + 0.06 * Math.sin(player.pulsePhase);
                const scaleX = pulse,
                    scaleY = 1 / pulse;
                let drawX = player.x,
                    drawY = player.y;
                if (gameState === STATE.MENU) { drawX = W / 2;
                    drawY = H / 2 - 10; }
                if (cameraImg.complete && cameraImg.naturalWidth > 0) {
                    ctx.save();
                    ctx.translate(drawX, drawY);
                    const baseSize = 70;
                    const sizeX = baseSize * scaleX * (1 + (player.speed / MAX_SPEED) * 0.05);
                    const sizeY = baseSize * scaleY * (1 + (player.speed / MAX_SPEED) * 0.05);
                    ctx.drawImage(cameraImg, -sizeX / 2, -sizeY / 2, sizeX, sizeY);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, player.radius * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#0a0a0c';
                    ctx.font = '32px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('📷', drawX, drawY + 2);
                }
                if (gameState === STATE.MENU) {
                    const time = Date.now() * 0.001;
                    for (let i = 0; i < 12; i++) {
                        const angle = i * (Math.PI / 6) + time * 0.3;
                        const radius = 80 + 15 * Math.sin(time * 0.5 + i);
                        const x = W / 2 + Math.cos(angle) * radius,
                            y = H / 2 - 10 + Math.sin(angle) * radius * 0.6;
                        const alpha = 0.2 + 0.15 * Math.sin(time + i);
                        ctx.beginPath();
                        ctx.arc(x, y, 4 + 3 * Math.sin(time * 0.7 + i), 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(251, 191, 36, ${alpha})`;
                        ctx.fill();
                    }
                    for (let i = 0; i < 8; i++) {
                        const angle = i * (Math.PI / 4) + time * 0.2;
                        const x1 = W / 2 + Math.cos(angle) * 60,
                            y1 = H / 2 - 10 + Math.sin(angle) * 40;
                        const x2 = W / 2 + Math.cos(angle + 0.1) * 110,
                            y2 = H / 2 - 10 + Math.sin(angle + 0.1) * 70;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = `rgba(251, 191, 36, ${0.08 + 0.06 * Math.sin(time + i)})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '12px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(`⚡ ${Math.round(player.speed)} км/ч`, 12, H - 10);
                }
            }

            function gameLoop() {
                update();
                draw();
                frameId = requestAnimationFrame(gameLoop);
            }

            function startGame() {
                menuOverlay.style.opacity = '0';
                setTimeout(() => { menuOverlay.style.display = 'none'; }, 500);
                gameState = STATE.TRANSITION;
                transitionProgress = 0;
                player.x = W / 2;
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.pulsePhase = 0;
                gameActive = true;
                menuBtn.style.display = 'inline-block';
                stars = [];
                clouds = [];
                score = 0;
                updateUI();
            }
            startBtn.addEventListener('click', startGame);

            function goToMenu() {
                gameState = STATE.MENU;
                gameActive = false;
                menuOverlay.style.display = 'flex';
                setTimeout(() => { menuOverlay.style.opacity = '1'; }, 50);
                menuBtn.style.display = 'none';
                document.querySelector('.overlay').classList.remove('show');
                stars = [];
                clouds = [];
                player.x = W / 2;
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                score = 0;
                updateUI();
            }
            menuBtn.addEventListener('click', goToMenu);

            function restartGame() {
                document.querySelector('.overlay').classList.remove('show');
                gameState = STATE.PLAYING;
                gameActive = true;
                player.x = 80;
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.pulsePhase = 0;
                score = 0;
                stars = [];
                clouds = [];
                frameCount = 0;
                updateUI();
            }
            restartBtn.addEventListener('click', restartGame);

            gameState = STATE.MENU;
            player.x = W / 2;
            player.y = H / 2;
            bestSpan.textContent = bestScore;
            frameId = requestAnimationFrame(gameLoop);
            cameraImg.onerror = function() { console.warn('Картинка не загрузилась, используется эмодзи'); };
        })();
    </script>
</body>
</html>
