<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Небесный объектив</title>
    <script>
        const backgroundMusic = new Audio('https://raw.githubusercontent.com/Reparsing/niksartphoto/main/media/Nero_s_Day_At_Disneyland_-_Sprawling_Idiot_Effigy_(SkySound7.com).mp3');
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.3;
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
        }
        .game-wrapper {
            background: #16161a;
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.06);
            max-width: 700px;
            width: 100%;
            position: relative;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            color: #f4f4f5;
            font-size: 1.2rem;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .game-header span { color: #fbbf24; }
        #gameCanvas {
            width: 100%;
            height: 500px;
            background: radial-gradient(ellipse at 30% 20%, #132a44, #0a1628);
            border-radius: 20px;
            display: block;
            touch-action: none;
            position: relative;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #f4f4f5;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        .btn-primary { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        .btn-sm { padding: 6px 16px; font-size: 0.8rem; }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            border-radius: 32px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .overlay.show { display: flex; }
        .overlay-box {
            background: #1c1c22;
            padding: 40px 36px;
            border-radius: 28px;
            text-align: center;
            max-width: 340px;
            border: 1px solid rgba(255,255,255,0.08);
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .overlay-box h2 { color: #f87171; font-size: 2rem; margin-bottom: 6px; }
        .overlay-box p { color: #a1a1aa; font-size: 1rem; margin-bottom: 20px; }
        .overlay-box .btn { background: #f87171; border-color: #f87171; color: #0a0a0c; }
        .overlay-box .btn:hover { background: #fca5a5; }
        .menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10,10,12,0.5);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
        }
        .menu-overlay.hidden { display: none; }
        .menu-overlay h1 { color: #fff; font-size: 2.2rem; margin-bottom: 4px; }
        .menu-overlay h1 span { color: #fbbf24; }
        .menu-overlay p { color: #a1a1aa; margin-bottom: 16px; }
        .menu-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .menu-buttons .btn { font-size: 1rem; padding: 12px 24px; }
        .control-select {
            display: none;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin: 12px 0;
            width: 100%;
        }
        .control-select.show { display: flex; }
        .control-select .btn { min-width: 140px; }
        .control-select .btn.active { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        @media (max-width: 500px) {
            .game-wrapper { padding: 12px; }
            #gameCanvas { height: 400px; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="game-header">
        <div>📸 <span id="scoreDisplay">0</span></div>
        <div>🏆 <span id="bestDisplay">0</span></div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="600" height="500"></canvas>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="menu-overlay" id="menuOverlay">
            <h1>Небесный <span>объектив</span></h1>
            <p>Выбери управление</p>

            <div class="control-select show" id="controlSelect">
                <button class="btn btn-primary" id="controlCursor">🖱️ Курсор / палец</button>
                <button class="btn" id="controlButtons">🔘 Кнопки ▲▼</button>
            </div>

            <div class="menu-buttons" style="margin-top: 8px;">
                <button class="btn btn-primary" id="startBtn">🚀 Играть</button>
                <a href="https://reparsing.github.io/niksartphoto/" class="btn">🏠 На главную</a>
            </div>
        </div>

        <!-- ОКНО ПРОИГРЫША -->
        <div class="overlay" id="gameOverOverlay">
            <div class="overlay-box">
                <h2>💥 Игра окончена</h2>
                <p>Счёт: <strong id="finalScore">0</strong></p>
                <button class="btn" id="restartBtn">🔄 Играть снова</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <span style="color:#a1a1aa; font-size:0.9rem;" id="controlLabel">Управление: курсор</span>
        <button class="btn btn-sm" id="menuBtn">📋 Меню</button>
    </div>
</div>

<script>
    (function() {
        // ===== ИНИЦИАЛИЗАЦИЯ =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const bestSpan = document.getElementById('bestDisplay');
        const finalScoreSpan = document.getElementById('finalScore');
        const menuOverlay = document.getElementById('menuOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const menuBtn = document.getElementById('menuBtn');
        const controlSelect = document.getElementById('controlSelect');
        const controlCursor = document.getElementById('controlCursor');
        const controlButtons = document.getElementById('controlButtons');
        const controlLabel = document.getElementById('controlLabel');

        const W = 600, H = 500;

        // ===== ЗАГРУЗКА КАРТИНКИ =====
        const cameraImg = new Image();
        cameraImg.crossOrigin = 'Anonymous';
        cameraImg.src = 'https://raw.githubusercontent.com/Reparsing/niksartphoto/main/images/camera.png';

        // ===== СОСТОЯНИЯ =====
        const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let gameState = STATE.MENU;
        let gameActive = false;
        let frameId = null;
        let frameCount = 0;

        // ===== ВЫБОР УПРАВЛЕНИЯ =====
        let controlMode = 'cursor'; // 'cursor' или 'buttons'

        // ===== ИГРОК =====
        let player = {
            x: 120,
            y: H / 2,
            vy: 0,
            radius: 22,
            pulsePhase: 0,
            speed: 3.0,
            score: 0
        };

        let stars = [];
        let clouds = [];
        let bestScore = parseInt(localStorage.getItem('niksBestScore')) || 0;

        const GRAVITY = 0.15,
            JUMP_FORCE = -0.5,
            MAX_SPEED = 8.0,
            FRICTION = 0.98;

        // ===== УПРАВЛЕНИЕ =====
        let targetY = player.y;
        let upPressed = false,
            downPressed = false;

        // ===== ФУНКЦИИ МУЗЫКИ =====
        function playMusic() {
            backgroundMusic.play().catch(e => console.log('Автовоспроизведение заблокировано'));
        }
        function stopMusic() {
            backgroundMusic.pause();
            backgroundMusic.currentTime = 0;
        }

        // ===== ИНИЦИАЛИЗАЦИЯ ИГРЫ =====
        function initGame() {
            player.y = H / 2;
            player.vy = 0;
            player.speed = 3.0;
            player.pulsePhase = 0;
            player.score = 0;
            stars = [];
            clouds = [];
            frameCount = 0;
            gameActive = true;
            gameState = STATE.PLAYING;
            gameOverOverlay.classList.remove('show');
            menuOverlay.classList.add('hidden');
            updateUI();
            playMusic();

            // Обновляем подпись
            if (controlMode === 'cursor') {
                controlLabel.textContent = 'Управление: курсор / палец';
            } else {
                controlLabel.textContent = 'Управление: кнопки ▲▼';
            }
        }

        function spawnStar() {
            const y = 30 + Math.random() * (H - 60);
            stars.push({ x: W + 20, y, r: 12, speed: 1.5 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2 });
        }

        function spawnCloud() {
            const y = 30 + Math.random() * (H - 60);
            const size = 28 + Math.random() * 16;
            clouds.push({ x: W + 20, y, r: size, speed: 2.0 + Math.random() * 1.5, phase: Math.random() * Math.PI * 2 });
        }

        function updateUI() {
            scoreSpan.textContent = player.score;
            bestSpan.textContent = bestScore;
        }

        // ===== ОБНОВЛЕНИЕ ИГРЫ =====
        function update() {
            if (!gameActive) return;
            frameCount++;

            // ---- Управление ----
            if (controlMode === 'cursor') {
                // Плавное следование за курсором (БЕЗ ШАТАНИЯ)
                const diff = targetY - player.y;
                player.vy += diff * 0.008; // Очень плавно
            } else {
                // Кнопки
                if (upPressed) player.vy += JUMP_FORCE * 0.6;
                if (downPressed) player.vy += GRAVITY * 0.6;
            }

            // ---- Физика ----
            player.vy += GRAVITY;
            player.vy *= FRICTION;
            player.y += player.vy;

            // ---- Границы ----
            const margin = 30;
            if (player.y < margin) { player.y = margin;
                player.vy = 0; }
            if (player.y > H - margin) { player.y = H - margin;
                player.vy = 0; }

            // ---- Пульсация ----
            player.pulsePhase += 0.05 * (player.speed / MAX_SPEED + 0.3);

            // ---- Скорость ----
            if (frameCount % 60 === 0 && player.speed < MAX_SPEED) player.speed += 0.05;

            // ---- Спавн объектов ----
            if (frameCount % 35 === 0) spawnStar();
            if (frameCount % 55 === 0) spawnCloud();
            if (frameCount % 80 === 0 && frameCount > 100) spawnCloud();

            // ---- Сбор звёзд ----
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                star.x -= star.speed * (player.speed / 3);
                star.phase += 0.05;

                const dx = player.x - star.x,
                    dy = player.y - star.y,
                    dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < player.radius + star.r) {
                    player.score++;
                    if (player.score > bestScore) {
                        bestScore = player.score;
                        localStorage.setItem('niksBestScore', bestScore);
                    }
                    stars.splice(i, 1);
                    updateUI();
                    continue;
                }

                if (star.x < -20) stars.splice(i, 1);
            }

            // ---- Столкновение с тучей ----
            for (let i = clouds.length - 1; i >= 0; i--) {
                const cloud = clouds[i];
                cloud.x -= cloud.speed * (player.speed / 3);
                cloud.phase += 0.02;

                const dx = player.x - cloud.x,
                    dy = player.y - cloud.y,
                    dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < player.radius + cloud.r) {
                    gameActive = false;
                    gameState = STATE.GAMEOVER;
                    finalScoreSpan.textContent = player.score;
                    gameOverOverlay.classList.add('show');
                    stopMusic();
                    return;
                }

                if (cloud.x < -40) clouds.splice(i, 1);
            }

            if (stars.length > 20) stars.splice(0, stars.length - 20);
            if (clouds.length > 15) clouds.splice(0, clouds.length - 15);
        }

        // ===== ОТРИСОВКА =====
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Шлейф
            const trailLen = 14;
            for (let i = 1; i < trailLen; i++) {
                const alpha = 0.25 * (1 - i / trailLen) * (player.speed / MAX_SPEED + 0.3);
                const hue = (i * 15 + Date.now() * 0.03) % 360;
                const size = (1 - i / trailLen) * player.radius * 0.9;
                const xOff = -i * 4,
                    yOff = -player.vy * i * 0.5;
                ctx.beginPath();
                ctx.arc(player.x + xOff, player.y + yOff, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
                ctx.fill();
            }

            // Звёзды
            for (let star of stars) {
                const pulse = 1 + 0.15 * Math.sin(star.phase);
                const r = star.r * pulse;
                const grad = ctx.createRadialGradient(star.x, star.y, 2, star.x, star.y, r * 2.5);
                grad.addColorStop(0, '#fbbf24');
                grad.addColorStop(0.5, 'rgba(251,191,36,0.3)');
                grad.addColorStop(1, 'rgba(251,191,36,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(star.x, star.y, r * 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fcd34d';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(star.x, star.y, r * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Тучи
            for (let cloud of clouds) {
                const pulse = 1 + 0.05 * Math.sin(cloud.phase);
                const r = cloud.r * pulse;
                ctx.fillStyle = 'rgba(180,190,200,0.4)';
                ctx.shadowColor = 'rgba(180,190,200,0.1)';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                for (let j = 0; j < 5; j++) {
                    const angle = j * 1.3 + cloud.phase;
                    const dx = Math.cos(angle) * r * 0.6,
                        dy = Math.sin(angle) * r * 0.6;
                    ctx.beginPath();
                    ctx.arc(cloud.x + dx, cloud.y + dy, r * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(200,210,220,0.2)';
                    ctx.fill();
                }
            }

            // Камера (БЕЗ ПОВОРОТА И ШАТАНИЯ)
            drawPlayer(player, '#fbbf24');

            // Спидометр
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`⚡ ${Math.round(player.speed)} км/ч`, 12, H - 10);
        }

        function drawPlayer(p, color) {
            const pulse = 1 + 0.06 * Math.sin(p.pulsePhase);
            const scaleX = pulse,
                scaleY = 1 / pulse;
            if (cameraImg.complete && cameraImg.naturalWidth > 0) {
                ctx.save();
                ctx.translate(p.x, p.y);
                // НЕТ ПОВОРОТА! ТОЛЬКО ПУЛЬСАЦИЯ
                const baseSize = 50;
                const sizeX = baseSize * scaleX * (1 + (p.speed / MAX_SPEED) * 0.05);
                const sizeY = baseSize * scaleY * (1 + (p.speed / MAX_SPEED) * 0.05);
                ctx.drawImage(cameraImg, -sizeX / 2, -sizeY / 2, sizeX, sizeY);
                ctx.restore();
            } else {
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * pulse, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#0a0a0c';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📷', p.x, p.y + 2);
            }
        }

        function gameLoop() {
            update();
            draw();
            frameId = requestAnimationFrame(gameLoop);
        }

        // ===== УПРАВЛЕНИЕ =====
        // Курсор
        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== STATE.PLAYING || controlMode !== 'cursor') return;
            const rect = canvas.getBoundingClientRect();
            const scaleY = canvas.height / rect.height;
            targetY = (e.clientY - rect.top) * scaleY;
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameState !== STATE.PLAYING || controlMode !== 'cursor') return;
            const rect = canvas.getBoundingClientRect();
            const scaleY = canvas.height / rect.height;
            const touch = e.touches[0];
            if (touch) targetY = (touch.clientY - rect.top) * scaleY;
        }, { passive: false });

        // Кнопки
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                upPressed = true;
                e.preventDefault();
            }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                downPressed = true;
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                upPressed = false;
                e.preventDefault();
            }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                downPressed = false;
                e.preventDefault();
            }
        });

        // ===== ВЫБОР УПРАВЛЕНИЯ =====
        controlCursor.addEventListener('click', () => {
            controlMode = 'cursor';
            controlCursor.classList.add('btn-primary');
            controlCursor.classList.remove('btn');
            controlButtons.classList.remove('btn-primary');
            controlButtons.classList.add('btn');
            controlLabel.textContent = 'Управление: курсор / палец';
        });

        controlButtons.addEventListener('click', () => {
            controlMode = 'buttons';
            controlButtons.classList.add('btn-primary');
            controlButtons.classList.remove('btn');
            controlCursor.classList.remove('btn-primary');
            controlCursor.classList.add('btn');
            controlLabel.textContent = 'Управление: кнопки ▲▼';
        });

        // ===== КНОПКИ =====
        function startGame() {
            menuOverlay.classList.add('hidden');
            initGame();
        }

        startBtn.addEventListener('click', startGame);

        function restartGame() {
            gameOverOverlay.classList.remove('show');
            initGame();
        }
        restartBtn.addEventListener('click', restartGame);

        function goToMenu() {
            gameActive = false;
            gameState = STATE.MENU;
            gameOverOverlay.classList.remove('show');
            menuOverlay.classList.remove('hidden');
            stars = [];
            clouds = [];
            player.score = 0;
            updateUI();
            stopMusic();
        }
        menuBtn.addEventListener('click', goToMenu);

        // ===== ЗАПУСК =====
        bestSpan.textContent = bestScore;
        frameId = requestAnimationFrame(gameLoop);
        cameraImg.onerror = function() { console.warn('Картинка не загрузилась'); };
    })();
</script>
</body>
</html>
