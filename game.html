<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>Небесный объектив</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}body{background:#0a0a0c;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif;padding:16px}.game-wrapper{background:#16161a;border-radius:32px;padding:24px;border:1px solid rgba(255,255,255,.06);max-width:700px;width:100%;position:relative}.game-header{display:flex;justify-content:space-between;color:#f4f4f5;font-size:1.2rem;font-weight:600;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:16px;flex-wrap:wrap;gap:8px}.game-header span{color:#fbbf24}#gameCanvas{width:100%;height:500px;background:radial-gradient(ellipse at 30%20%,#132a44,#0a1628);border-radius:20px;display:block;touch-action:none;position:relative;cursor:pointer}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;align-items:center}.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#f4f4f5;padding:8px 16px;border-radius:40px;font-weight:600;font-size:.9rem;transition:all .3s;cursor:pointer;font-family:inherit}.btn:hover{background:#fbbf24;color:#0a0a0c;border-color:#fbbf24}.btn-primary{background:#fbbf24;color:#0a0a0c;border-color:#fbbf24}.btn-sm{padding:4px 12px;font-size:.75rem}.rules-overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);border-radius:32px;display:none;justify-content:center;align-items:center;z-index:40;padding:20px}.rules-overlay.show{display:flex}.rules-box{background:#1c1c22;padding:28px;border-radius:28px;text-align:center;max-width:480px;width:100%;border:1px solid rgba(255,255,255,.08)}.rules-box .preview-wrapper{width:100%;height:140px;background:radial-gradient(circle at 30%30%,#132a44,#0a1628);border-radius:16px;margin-bottom:12px;overflow:hidden}.rules-box .preview-wrapper canvas{width:100%;height:100%}.rules-box h2{color:#fff;font-size:1.6rem;margin-bottom:4px}.rules-box h2 span{color:#fbbf24}.rules-box .rules-text{color:#a1a1aa;font-size:.85rem;line-height:1.5;text-align:left;margin-bottom:12px;padding:0 4px}.rules-box .rules-text strong{color:#fbbf24}.rules-box .close-rules-btn{background:#fbbf24;border:2px solid #fbbf24;color:#0a0a0c;padding:10px 32px;border-radius:40px;font-weight:700;font-size:1rem;cursor:pointer;transition:all .3s;font-family:inherit;animation:pulse-btn 1.5s ease-in-out infinite}.rules-box .close-rules-btn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(251,191,36,.4)}@keyframes pulse-btn{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}.overlay{position:absolute;inset:0;border-radius:32px;display:none;justify-content:center;align-items:center;z-index:10}.overlay.show{display:flex;background:rgba(0,0,0,.85);backdrop-filter:blur(8px)}.overlay-box{background:#1c1c22;padding:32px;border-radius:28px;text-align:center;max-width:320px;border:1px solid rgba(255,255,255,.08)}.overlay-box h2{color:#f87171;font-size:2rem}.overlay-box p{color:#a1a1aa;font-size:1rem;margin-bottom:16px}.overlay-box p strong{color:#fbbf24;font-size:1.3rem}.overlay-box .btn{background:#f87171;border-color:#f87171;color:#0a0a0c;padding:10px 28px;font-size:1rem}.menu-overlay{position:absolute;inset:0;background:rgba(10,10,12,.5);backdrop-filter:blur(4px);border-radius:32px;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;padding:20px}.menu-overlay.hidden{display:none}.menu-overlay h1{color:#fff;font-size:2rem;margin-bottom:4px}.menu-overlay h1 span{color:#fbbf24}.menu-overlay p{color:#a1a1aa;margin-bottom:12px}.menu-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.menu-buttons .btn{font-size:.95rem;padding:10px 20px;min-width:120px}.settings-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);border-radius:32px;display:none;justify-content:center;align-items:center;z-index:30;padding:20px}.settings-overlay.show{display:flex}.settings-box{background:#1c1c22;padding:24px;border-radius:28px;text-align:center;max-width:420px;width:100%;border:1px solid rgba(255,255,255,.08)}.settings-box h2{color:#fff;font-size:1.3rem;margin-bottom:8px}.settings-box .preview-wrapper{width:140px;height:140px;margin:0 auto 12px;border-radius:50%;border:2px solid rgba(255,255,255,.1);overflow:hidden}.settings-box .preview-wrapper canvas{width:100%;height:100%}.color-option{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;transition:all .3s}.color-option:hover{transform:scale(1.1)}.color-option.active{border-color:#fff;box-shadow:0 0 15px rgba(255,255,255,.3)}.color-picker{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}.settings-box .close-settings{margin-top:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#f4f4f5;padding:6px 20px;border-radius:40px;font-weight:600;font-size:.85rem;cursor:pointer}.settings-box .close-settings:hover{background:#fbbf24;color:#0a0a0c;border-color:#fbbf24}.countdown-overlay{position:absolute;inset:0;border-radius:32px;display:none;justify-content:center;align-items:center;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}.countdown-overlay.show{display:flex}.countdown-number{font-size:8rem;font-weight:900;color:#fbbf24;text-shadow:0 0 60px rgba(251,191,36,.5);animation:countPop .8s cubic-bezier(.34,1.56,.64,1)}@keyframes countPop{0%{transform:scale(2);opacity:0}50%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}.pause-overlay{position:absolute;inset:0;border-radius:32px;display:none;justify-content:center;align-items:center;z-index:45;background:rgba(0,0,0,.8);backdrop-filter:blur(8px)}.pause-overlay.show{display:flex}.pause-box{background:#1c1c22;padding:28px;border-radius:28px;text-align:center;max-width:300px;border:1px solid rgba(255,255,255,.08)}.pause-box h2{color:#fbbf24;font-size:1.8rem}.pause-box p{color:#a1a1aa;font-size:1rem;margin-bottom:12px}.pause-box p strong{color:#fbbf24;font-size:1.4rem}.pause-box .btn-group{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pause-camera-wrapper{width:60px;height:60px;margin:0 auto 6px}#pauseCameraCanvas{width:100%;height:100%}.record-flash{animation:flashGold .5s ease-in-out 3}@keyframes flashGold{0%,100%{color:#fbbf24}50%{color:#fff;text-shadow:0 0 20px #fbbf24}}@media(max-width:500px){.game-wrapper{padding:12px}#gameCanvas{height:400px}.settings-box .preview-wrapper{width:100px;height:100px}}
</style>
</head>
<body>
<div class="game-wrapper">
<div class="game-header"><div>📸 <span id="scoreDisplay">0</span></div><div>🏆 <span id="bestDisplay">0</span></div></div>
<div style="position:relative;">
<canvas id="gameCanvas" width="600" height="500"></canvas>
<div class="menu-overlay" id="menuOverlay">
  <h1>Небесный <span>объектив</span></h1>
  <p>Выбери режим игры</p>
  <div class="menu-buttons">
    <button class="btn btn-primary" id="startBtn">🚀 Раннер</button>
    <button class="btn btn-primary" id="parkourBtn" style="background:#8b5cf6;border-color:#8b5cf6;">🏃 Паркур</button>
    <a href="https://reparsing.github.io/niksartphoto/" class="btn">🏠 На главную</a>
  </div>
</div>
<div class="overlay" id="gameOverOverlay">
  <div class="overlay-box">
    <h2 id="gameOverTitle">💥 Игра окончена</h2>
    <p>Счёт: <strong id="finalScore">0</strong></p>
    <button class="btn" id="restartBtn">🔄 Играть снова</button>
  </div>
</div>
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-box">
    <h2>🎨 Цвет хвоста</h2>
    <div class="preview-wrapper"><canvas id="previewCanvas" width="160" height="160"></canvas></div>
    <div class="color-picker">
      <button class="color-option" data-color="#fbbf24" style="background:#fbbf24;" title="Золотой"></button>
      <button class="color-option" data-color="#ef4444" style="background:#ef4444;" title="Красный"></button>
      <button class="color-option" data-color="#3b82f6" style="background:#3b82f6;" title="Синий"></button>
      <button class="color-option" data-color="#22c55e" style="background:#22c55e;" title="Зелёный"></button>
      <button class="color-option" data-color="#a855f7" style="background:#a855f7;" title="Фиолетовый"></button>
      <button class="color-option" data-color="#ec4899" style="background:#ec4899;" title="Розовый"></button>
      <button class="color-option" data-color="#f97316" style="background:#f97316;" title="Оранжевый"></button>
      <button class="color-option" data-color="#14b8a6" style="background:#14b8a6;" title="Бирюзовый"></button>
      <button class="color-option" data-color="#ffffff" style="background:#ffffff;" title="Белый"></button>
    </div>
    <button class="close-settings" id="closeSettingsBtn">Закрыть</button>
  </div>
</div>
<div class="rules-overlay" id="rulesOverlay">
  <div class="rules-box">
    <h2>📖 <span id="rulesTitle">Правила игры</span></h2>
    <div class="preview-wrapper"><canvas id="rulesPreviewCanvas" width="600" height="160"></canvas></div>
    <div class="rules-text" id="rulesText"></div>
    <button class="close-rules-btn" id="closeRulesBtn">Понятно!</button>
  </div>
</div>
<div class="countdown-overlay" id="countdownOverlay">
  <div class="countdown-number" id="countdownNumber">3</div>
</div>
<div class="pause-overlay" id="pauseOverlay">
  <div class="pause-box">
    <div class="pause-camera-wrapper"><canvas id="pauseCameraCanvas" width="80" height="80"></canvas></div>
    <h2>⏸️ Пауза</h2>
    <p>Счёт: <strong id="pauseScore">0</strong></p>
    <div class="btn-group">
      <button class="btn btn-primary" id="resumeBtn" style="background:#fbbf24;border-color:#fbbf24;color:#0a0a0c;">▶️ Продолжить</button>
      <button class="btn" id="pauseMenuBtn">📋 В меню</button>
    </div>
  </div>
</div>
</div>
<div class="controls">
  <span style="color:#a1a1aa;font-size:.8rem;">Управление: мышь / палец</span>
  <button class="btn" id="fullscreenBtn">⛶ На весь экран</button>
  <button class="btn" id="rulesBtn">❓ Правила</button>
  <button class="btn btn-sm" id="settingsBtn">⚙️</button>
  <button class="btn btn-sm" id="pauseBtn">⏸️</button>
  <button class="btn btn-sm" id="menuBtn">📋 Меню</button>
  <button class="btn btn-sm" id="trailToggleBtn" style="background:rgba(74,222,128,0.2);border-color:#4ade80;">🌊 Хвост</button>
</div>
</div>
<script>
(function(){
const C=document.getElementById('gameCanvas'),X=C.getContext('2d'),S=document.getElementById('scoreDisplay'),B=document.getElementById('bestDisplay'),F=document.getElementById('finalScore'),GT=document.getElementById('gameOverTitle'),MO=document.getElementById('menuOverlay'),GO=document.getElementById('gameOverOverlay'),SO=document.getElementById('settingsOverlay'),RO=document.getElementById('rulesOverlay'),CO=document.getElementById('countdownOverlay'),PO=document.getElementById('pauseOverlay'),CN=document.getElementById('countdownNumber'),PS=document.getElementById('pauseScore'),rulesTitle=document.getElementById('rulesTitle'),rulesText=document.getElementById('rulesText');
const SB=document.getElementById('startBtn'),PKB=document.getElementById('parkourBtn'),RB=document.getElementById('restartBtn'),MB=document.getElementById('menuBtn'),PauseBtn=document.getElementById('pauseBtn'),ResumeBtn=document.getElementById('resumeBtn'),PauseMenuBtn=document.getElementById('pauseMenuBtn'),FB=document.getElementById('fullscreenBtn'),SETB=document.getElementById('settingsBtn'),CSB=document.getElementById('closeSettingsBtn'),RULESB=document.getElementById('rulesBtn'),CRB=document.getElementById('closeRulesBtn');
const PC=document.getElementById('previewCanvas'),PX=PC.getContext('2d'),RPC=document.getElementById('rulesPreviewCanvas'),RX=RPC.getContext('2d'),pauseCamCanvas=document.getElementById('pauseCameraCanvas'),pauseCamCtx=pauseCamCanvas.getContext('2d');
const W=600,H=500,CAM=new Image();CAM.crossOrigin='Anonymous';CAM.src='https://raw.githubusercontent.com/Reparsing/niksartphoto/main/images/camera.png';
const FRICTION=.92,STATE={MENU:0,COUNTDOWN:1,PLAYING:2,PAUSED:3,GAMEOVER:4,PARKOUR:5},MAX_TRAIL_LENGTH=50,MAGNET_DURATION=8*70,MAGNET_RADIUS=250;
let gs=STATE.MENU,ga=false,intervalId=null,fc=0,gameMode='runner',pendingGameMode=null;
let cs=1,ts=1,MIN=.5,MAX=1.8,STEP=.1,SPEED=.08,lives=3,maxLives=3,hp=[],ep=[],hasShield=false,shieldTimer=0,shieldDuration=10*70,shieldObjects=[],speedMult=1,speedInc=.03,maxSpeedMult=2.5;
let trailColor=localStorage.getItem('niksTrailColor')||'#fbbf24',trailEnabled=localStorage.getItem('niksTrailEnabled')!=='false';
let player={x:120,y:H/2,vy:0,baseRadius:22,pulsePhase:0,speed:3,score:0},stars=[],clouds=[],hearts=[],coins=[],magnets=[],bestScore=parseInt(localStorage.getItem('niksBestScore'))||0,targetY=player.y,shakeX=0,shakeY=0,shakeIntensity=0,bgStars=[],hasMagnet=false,magnetTimer=0,heartsCollected=0,trailHistory=[];
let parkourPlayer={x:80,y:350,vy:0,width:30,height:40},platforms=[],obstacles=[],parkourScore=0,parkourSpeed=3,parkourBest=parseInt(localStorage.getItem('parkourBest'))||0,onGround=false,jumpCount=0,maxJumps=2,parkourTimer=0,parkourHearts=[],parkourCoins=[],parkourMagnets=[],parkourLives=3,parkourMaxLives=3,parkourTrailHistory=[],parkourHeartsCollected=0,parkourHasMagnet=false,parkourMagnetTimer=0;
let demoPlayer={x:80,y:80,vy:0,pulsePhase:0},demoStars=[],demoClouds=[],demoShield=null,demoFrame=0,rulesAnimationId=null,demoMode='runner',demoPlatforms=[],demoObstacles=[],demoOnGround=false,demoJumpCount=0;
function initBgStars(){bgStars=[];for(let i=0;i<300;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.5,speed:.1+Math.random()*.3,twinkle:Math.random()*Math.PI*2})}initBgStars();
function getRadius(){return player.baseRadius*cs}
function spawnExplosion(x,y,color){const cols=color?[color,color,'#fff']:['#fbbf24','#f59e0b','#ef4444','#f472b6','#60a5fa','#34d399','#fcd34d'];for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;ep.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,size:4+Math.random()*8,life:1,color:cols[Math.floor(Math.random()*cols.length)],rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-.5)*.3})}}
function spawnHeartExplosion(x,y){for(let i=0;i<25;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;hp.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,size:3+Math.random()*5,life:1,color:`hsl(340,90%,${50+Math.random()*30}%)`,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-.5)*.2,type:'debris'})}for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,s=.5+Math.random()*1.5;hp.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,size:8+Math.random()*10,life:1,color:'#ef4444',rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-.5)*.1,type:'debris'})}}
function updateParticles(){for(let i=ep.length-1;i>=0;i--){const p=ep[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.rotation+=p.rotSpeed;p.life-=.008;if(p.life<=0)ep.splice(i,1)}for(let i=hp.length-1;i>=0;i--){const p=hp[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.rotation+=p.rotSpeed;p.life-=.012;if(p.life<=0)hp.splice(i,1)}}
function drawParticles(){for(let p of ep){X.save();X.translate(p.x,p.y);X.rotate(p.rotation);X.globalAlpha=p.life;X.fillStyle=p.color;X.shadowColor=p.color;X.shadowBlur=10;X.beginPath();X.arc(0,0,p.size*.5,0,Math.PI*2);X.fill();X.restore()}for(let p of hp){X.save();X.translate(p.x,p.y);X.rotate(p.rotation);X.globalAlpha=p.life;X.fillStyle=p.color;X.shadowColor=p.color;X.shadowBlur=8;if(p.type==='debris'){const s=p.size*.5;X.fillRect(-s/2,-s/2,s,s)}else{X.beginPath();X.arc(0,0,p.size*.5,0,Math.PI*2);X.fill()}X.restore()}X.globalAlpha=1;X.shadowBlur=0}
function spawnStar(){stars.push({x:W+20,y:30+Math.random()*(H-60),r:12,speed:1.5+Math.random()*.8,phase:Math.random()*Math.PI*2,scale:0})}
function spawnCloud(){const y=30+Math.random()*(H-60),size=28+Math.random()*16;clouds.push({x:W+20,y,r:size,speed:2+Math.random()*1.5,phase:Math.random()*Math.PI*2,scale:0})}
function spawnShield(){shieldObjects.push({x:W+20,y:30+Math.random()*(H-60),r:14,speed:1.8+Math.random()*.8,phase:Math.random()*Math.PI*2,scale:0})}
function spawnHeart(){hearts.push({x:W+20,y:30+Math.random()*(H-60),r:12,speed:1.2+Math.random()*.6,phase:Math.random()*Math.PI*2,scale:0})}
function spawnCoin(){coins.push({x:W+20,y:30+Math.random()*(H-60),r:10,speed:1.2+Math.random()*.6,phase:Math.random()*Math.PI*2,scale:0,rotation:0})}
function spawnMagnet(){magnets.push({x:W+20,y:30+Math.random()*(H-60),r:16,speed:1.2+Math.random()*.5,phase:Math.random()*Math.PI*2,scale:0})}
function spawnParkourCoin(){parkourCoins.push({x:W+30,y:100+Math.random()*250,r:10,speed:parkourSpeed*.6+.5,phase:Math.random()*Math.PI*2,rotation:0})}
function spawnParkourMagnet(){parkourMagnets.push({x:W+30,y:100+Math.random()*250,r:16,speed:parkourSpeed*.6+.5,phase:Math.random()*Math.PI*2})}
function spawnParkourHeart(x,y){const posX=x||W+30,posY=y||100+Math.random()*250;parkourHearts.push({x:posX,y:posY,r:12,speed:parkourSpeed*.6+.5,phase:Math.random()*Math.PI*2})}
function updateUI(){if(gameMode==='runner'){S.textContent=player.score;B.textContent=bestScore;if(player.score>0&&player.score===bestScore){B.classList.add('record-flash');setTimeout(()=>B.classList.remove('record-flash'),1500)}}else{S.textContent=parkourScore;B.textContent=parkourBest;if(parkourScore>0&&parkourScore===parkourBest){B.classList.add('record-flash');setTimeout(()=>B.classList.remove('record-flash'),1500)}}}
function updateTrailButton(){const btn=document.getElementById('trailToggleBtn');if(trailEnabled){btn.textContent='🌊 Хвост';btn.style.background='rgba(74,222,128,0.2)';btn.style.borderColor='#4ade80';btn.style.color='#4ade80'}else{btn.textContent='🚫 Хвост';btn.style.background='rgba(248,113,113,0.2)';btn.style.borderColor='#f87171';btn.style.color='#f87171'}}
function getTrailLength(){return Math.min(10+heartsCollected*2,MAX_TRAIL_LENGTH)}
function getParkourTrailLength(){return Math.min(10+parkourHeartsCollected*2,MAX_TRAIL_LENGTH)}
function drawTrailFromHistory(c,history,length,x,y,isDemo){if(history.length<2||!trailEnabled)return;const len=Math.min(length||history.length,history.length),time=Date.now()*.003,baseSize=isDemo?18:22;for(let i=0;i<len&&i<history.length-1;i++){const index=Math.min(i,history.length-1),point=history[index],progress=i/len,alpha=.6*(1-progress)*(1+.2*Math.sin(time+i*.2)),size=(1-progress*.7)*baseSize*cs,wave=Math.sin(time+i*.15)*2,relX=point.x-x,relY=point.y-y+wave;c.beginPath();c.arc(x+relX,y+relY,size,0,Math.PI*2);c.fillStyle=trailColor;c.shadowColor=trailColor;c.shadowBlur=15;c.fill()}c.shadowBlur=0}

function gameOver(title){ga=false;gs=STATE.GAMEOVER;GT.textContent=title||'💥 Игра окончена';if(gameMode==='runner'){F.textContent=player.score;spawnExplosion(player.x,player.y);const hSize=24,sp=10,total=maxLives*hSize+(maxLives-1)*sp,startX=(W-total)/2;for(let i=0;i<lives;i++){const x=startX+i*(hSize+sp),y=20+hSize*.3;setTimeout(()=>spawnHeartExplosion(x,y),i*150)}}else{F.textContent=parkourScore;spawnExplosion(parkourPlayer.x+parkourPlayer.width/2,parkourPlayer.y+parkourPlayer.height/2)}setTimeout(()=>{GO.style.display='flex';GO.classList.add('show');if(intervalId){clearInterval(intervalId);intervalId=null}},600)}
function togglePause(){if((gs===STATE.PLAYING||gs===STATE.PARKOUR)&&ga){gs=STATE.PAUSED;PO.classList.add('show');PS.textContent=gameMode==='runner'?player.score:parkourScore;if(intervalId){clearInterval(intervalId);intervalId=null}}else if(gs===STATE.PAUSED){gs=gameMode==='runner'?STATE.PLAYING:STATE.PARKOUR;PO.classList.remove('show');if(!intervalId){intervalId=setInterval(update,1000/70)}}}
function exitToMenu(){ga=false;gs=STATE.MENU;PO.classList.remove('show');GO.classList.remove('show');GO.style.display='none';MO.classList.remove('hidden');if(gameMode==='runner'){stars=[];clouds=[];shieldObjects=[];hearts=[];coins=[];magnets=[];hp=[];ep=[];player.score=0;trailHistory=[];heartsCollected=0;hasMagnet=false;magnetTimer=0}else{platforms=[];obstacles=[];parkourHearts=[];parkourCoins=[];parkourMagnets=[];parkourScore=0;parkourLives=parkourMaxLives;parkourTrailHistory=[];parkourHeartsCollected=0;parkourHasMagnet=false;parkourMagnetTimer=0}updateUI();if(intervalId){clearInterval(intervalId);intervalId=null}stopRulesDemo();RO.classList.remove('show')}
let previewInterval=null;
function openSettings(){SO.classList.add('show');updatePreview();if(previewInterval)clearInterval(previewInterval);previewInterval=setInterval(updatePreview,50);document.querySelectorAll('.color-option').forEach(el=>{const color=el.dataset.color;if(color===trailColor)el.classList.add('active');else el.classList.remove('active')})}
function closeSettings(){SO.classList.remove('show');if(previewInterval){clearInterval(previewInterval);previewInterval=null}}
document.getElementById('trailToggleBtn').addEventListener('click',function(){trailEnabled=!trailEnabled;localStorage.setItem('niksTrailEnabled',trailEnabled);updateTrailButton()});
document.querySelectorAll('.color-option').forEach(el=>{el.addEventListener('click',function(){const color=this.dataset.color;trailColor=color;localStorage.setItem('niksTrailColor',color);document.querySelectorAll('.color-option').forEach(opt=>opt.classList.remove('active'));this.classList.add('active');updatePreview()})});
C.addEventListener('mousemove',e=>{if(gs!==STATE.PLAYING||gameMode!=='runner')return;const rect=C.getBoundingClientRect(),scaleY=C.height/rect.height;targetY=(e.clientY-rect.top)*scaleY});
C.addEventListener('touchmove',e=>{e.preventDefault();if(gs!==STATE.PLAYING||gameMode!=='runner')return;const rect=C.getBoundingClientRect(),scaleY=C.height/rect.height,touch=e.touches[0];if(touch)targetY=(touch.clientY-rect.top)*scaleY},{passive:false});
C.addEventListener('click',()=>{if(gs!==STATE.PARKOUR||!ga)return;if(onGround||jumpCount<maxJumps){parkourPlayer.vy=-10-(jumpCount>0?2:0);jumpCount++;onGround=false}});
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Space'){e.preventDefault();if(gs===STATE.PARKOUR){if(onGround||jumpCount<maxJumps){parkourPlayer.vy=-10-(jumpCount>0?2:0);jumpCount++;onGround=false}}}if(e.key==='Escape'){if(gs===STATE.PLAYING||gs===STATE.PARKOUR||gs===STATE.PAUSED){e.preventDefault();togglePause()}}});
FB.addEventListener('click',()=>{if(!document.fullscreenElement){const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(e=>console.warn(e));else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();else if(el.msRequestFullscreen)el.msRequestFullscreen()}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen()}});
SETB.addEventListener('click',openSettings);CSB.addEventListener('click',closeSettings);SO.addEventListener('click',e=>{if(e.target===SO)closeSettings()});
RULESB.addEventListener('click',()=>{showRules(gameMode)});
CRB.addEventListener('click',()=>{RO.classList.remove('show');stopRulesDemo();if(pendingGameMode){const mode=pendingGameMode;pendingGameMode=null;if(mode==='runner')initRunner();else if(mode==='parkour')initParkour()}});
RO.addEventListener('click',e=>{if(e.target===RO){RO.classList.remove('show');stopRulesDemo();if(pendingGameMode){const mode=pendingGameMode;pendingGameMode=null;if(mode==='runner')initRunner();else if(mode==='parkour')initParkour()}}});
SB.addEventListener('click',()=>{startWithRules('runner')});PKB.addEventListener('click',()=>{startWithRules('parkour')});
RB.addEventListener('click',()=>{GO.classList.remove('show');setTimeout(()=>{GO.style.display='none';if(gameMode==='runner'){pendingGameMode='runner';showRules('runner')}else{pendingGameMode='parkour';showRules('parkour')}},400)});
MB.addEventListener('click',exitToMenu);PauseBtn.addEventListener('click',togglePause);ResumeBtn.addEventListener('click',togglePause);PauseMenuBtn.addEventListener('click',exitToMenu);
B.textContent=bestScore||parkourBest;updateTrailButton();
function loop(){draw();requestAnimationFrame(loop)}loop();
CAM.onerror=function(){console.warn('Картинка не загрузилась')};
})();
</script>
