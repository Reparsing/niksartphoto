<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Небесный объектив</title>
    <script>
        const backgroundMusic = new Audio('https://raw.githubusercontent.com/Reparsing/niksartphoto/main/media/Nero_s_Day_At_Disneyland_-_Sprawling_Idiot_Effigy_(SkySound7.com).mp3');
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.3;
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
        }
        .game-wrapper {
            background: #16161a;
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.06);
            max-width: 700px;
            width: 100%;
            position: relative;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            color: #f4f4f5;
            font-size: 1.2rem;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .game-header span { color: #fbbf24; }
        #gameCanvas {
            width: 100%;
            height: 500px;
            background: radial-gradient(ellipse at 30% 20%, #132a44, #0a1628);
            border-radius: 20px;
            display: block;
            touch-action: none;
            position: relative;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
            align-items: center;
        }
        .btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #f4f4f5;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        .btn-primary { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        .btn-sm { padding: 6px 16px; font-size: 0.8rem; }
        .btn-scale {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 1.2rem;
            padding: 6px 14px;
            min-width: 40px;
        }
        .btn-scale:hover { background: #fbbf24; color: #0a0a0c; }
        .scale-display {
            color: #a1a1aa;
            font-size: 0.9rem;
            min-width: 40px;
            text-align: center;
            font-weight: 600;
        }
        .btn-fullscreen {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        .btn-fullscreen:hover { background: #fbbf24; color: #0a0a0c; }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.0);
            backdrop-filter: blur(0px);
            border-radius: 32px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .overlay.show {
            display: flex;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
        }
        .overlay-box {
            background: #1c1c22;
            padding: 40px 36px;
            border-radius: 28px;
            text-align: center;
            max-width: 340px;
            border: 1px solid rgba(255,255,255,0.08);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(0.8);
            opacity: 0;
        }
        .overlay.show .overlay-box {
            transform: scale(1);
            opacity: 1;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .overlay-box h2 { color: #f87171; font-size: 2.2rem; margin-bottom: 6px; }
        .overlay-box p { color: #a1a1aa; font-size: 1.1rem; margin-bottom: 20px; }
        .overlay-box p strong { color: #fbbf24; font-size: 1.4rem; }
        .overlay-box .btn { background: #f87171; border-color: #f87171; color: #0a0a0c; padding: 12px 32px; font-size: 1.1rem; }
        .overlay-box .btn:hover { background: #fca5a5; border-color: #fca5a5; transform: scale(1.05); }
        .menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10,10,12,0.5);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
        }
        .menu-overlay.hidden { display: none; }
        .menu-overlay h1 { color: #fff; font-size: 2.2rem; margin-bottom: 4px; }
        .menu-overlay h1 span { color: #fbbf24; }
        .menu-overlay p { color: #a1a1aa; margin-bottom: 16px; }
        .menu-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .menu-buttons .btn { font-size: 1rem; padding: 12px 24px; }
        @media (max-width: 500px) {
            .game-wrapper { padding: 12px; }
            #gameCanvas { height: 400px; }
            .overlay-box { padding: 30px 24px; }
            .overlay-box h2 { font-size: 1.8rem; }
            .btn-scale { padding: 4px 12px; font-size: 1rem; min-width: 34px; }
            .scale-display { min-width: 30px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="game-header">
        <div>📸 <span id="scoreDisplay">0</span></div>
        <div>🏆 <span id="bestDisplay">0</span></div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="600" height="500"></canvas>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="menu-overlay" id="menuOverlay">
            <h1>Небесный <span>объектив</span></h1>
            <p>Управляй камерой пальцем или мышкой</p>
            <div class="menu-buttons">
                <button class="btn btn-primary" id="startBtn">🚀 Играть</button>
                <a href="https://reparsing.github.io/niksartphoto/" class="btn">🏠 На главную</a>
            </div>
        </div>

        <!-- ОКНО ПРОИГРЫША -->
        <div class="overlay" id="gameOverOverlay">
            <div class="overlay-box">
                <h2>💥 Игра окончена</h2>
                <p>Счёт: <strong id="finalScore">0</strong></p>
                <button class="btn" id="restartBtn">🔄 Играть снова</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <span style="color:#a1a1aa; font-size:0.9rem;">Управление: мышь / палец</span>
        <button class="btn btn-scale" id="zoomOutBtn">−</button>
        <span class="scale-display" id="scaleDisplay">1.0</span>
        <button class="btn btn-scale" id="zoomInBtn">+</button>
        <button class="btn btn-fullscreen" id="fullscreenBtn">⛶ На весь экран</button>
        <button class="btn btn-sm" id="menuBtn">📋 Меню</button>
    </div>
</div>

<script>
    (function() {
        // ===== ИНИЦИАЛИЗАЦИЯ =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const bestSpan = document.getElementById('bestDisplay');
        const finalScoreSpan = document.getElementById('finalScore');
        const menuOverlay = document.getElementById('menuOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const menuBtn = document.getElementById('menuBtn');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const scaleDisplay = document.getElementById('scaleDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const W = 600, H = 500;

        // ===== ЗАГРУЗКА КАРТИНКИ =====
        const cameraImg = new Image();
        cameraImg.crossOrigin = 'Anonymous';
        cameraImg.src = 'https://raw.githubusercontent.com/Reparsing/niksartphoto/main/images/camera.png';

        // ===== СОСТОЯНИЯ =====
        const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let gameState = STATE.MENU;
        let gameActive = false;
        let intervalId = null;
        let frameCount = 0;

        // ===== МАСШТАБ =====
        let currentScale = 1.0;
        let targetScale = 1.0;
        const MIN_SCALE = 0.5, MAX_SCALE = 1.8, SCALE_STEP = 0.1, SCALE_SPEED = 0.08;

        // ===== ЖИЗНИ И ЧАСТИЦЫ =====
        let lives = 3;
        const MAX_LIVES = 3;
        let heartParticles = [];
        let cameraExplosionParticles = [];

        // ===== ЩИТЫ (10 секунд) =====
        let hasShield = false;
        let shieldTimer = 0;
        const SHIELD_DURATION = 10 * 70; // 10 секунд при 70 FPS
        let shieldObjects = [];

        // ===== УСКОРЕНИЕ =====
        let speedMultiplier = 1.0;
        const SPEED_INCREMENT = 0.03, MAX_SPEED_MULTIPLIER = 2.5;

        // ===== ИГРОК =====
        let player = {
            x: 120, y: H/2, vy: 0, baseRadius: 22,
            pulsePhase: 0, speed: 3.0, score: 0
        };
        function getPlayerRadius() { return player.baseRadius * currentScale; }

        let stars = [], clouds = [];
        let bestScore = parseInt(localStorage.getItem('niksBestScore')) || 0;

        const GRAVITY = 0.15, FRICTION = 0.92;

        let targetY = player.y;

        // ===== МУЗЫКА =====
        function playMusic() {
            backgroundMusic.play().catch(e => console.log('Автовоспроизведение заблокировано'));
        }
        function stopMusic() {
            backgroundMusic.pause();
            backgroundMusic.currentTime = 0;
        }

        // ===== ЧАСТИЦЫ =====
        function spawnCameraExplosion(x, y) {
            const colors = ['#fbbf24','#f59e0b','#ef4444','#f472b6','#60a5fa','#34d399','#fcd34d'];
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4;
                const size = 4 + Math.random() * 8;
                cameraExplosionParticles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    size, life: 1.0,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.3,
                });
            }
        }

        function spawnHeartExplosion(x, y) {
            const half1 = {
                x, y,
                vx: -2 + Math.random() * 1.5,
                vy: -3 + Math.random() * 2,
                size: 16, life: 1.0,
                rotation: 0, rotSpeed: (Math.random() - 0.5) * 0.2,
                part: 'left', color: '#ef4444'
            };
            const half2 = {
                x, y,
                vx: 2 + Math.random() * 1.5,
                vy: -3 + Math.random() * 2,
                size: 16, life: 1.0,
                rotation: 0, rotSpeed: (Math.random() - 0.5) * 0.2,
                part: 'right', color: '#ef4444'
            };
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 2;
                heartParticles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    size: 4 + Math.random() * 4,
                    life: 1.0,
                    rotation: 0,
                    rotSpeed: (Math.random() - 0.5) * 0.3,
                    part: 'debris',
                    color: `hsl(0, 80%, ${50 + Math.random() * 30}%)`
                });
            }
            heartParticles.push(half1, half2);
        }

        function updateParticles() {
            for (let i = cameraExplosionParticles.length - 1; i >= 0; i--) {
                const p = cameraExplosionParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.03;
                p.rotation += p.rotSpeed;
                p.life -= 0.008;
                if (p.life <= 0) cameraExplosionParticles.splice(i, 1);
            }
            for (let i = heartParticles.length - 1; i >= 0; i--) {
                const p = heartParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.rotation += p.rotSpeed;
                p.life -= 0.015;
                if (p.life <= 0) heartParticles.splice(i, 1);
            }
        }

        function drawParticles() {
            for (let p of cameraExplosionParticles) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            for (let p of heartParticles) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.globalAlpha = p.life;
                if (p.part === 'left') {
                    ctx.fillStyle = p.color || '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(-10, -10, 0, -18);
                    ctx.quadraticCurveTo(0, -10, 0, 0);
                    ctx.fill();
                } else if (p.part === 'right') {
                    ctx.fillStyle = p.color || '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(10, -10, 0, -18);
                    ctx.quadraticCurveTo(0, -10, 0, 0);
                    ctx.fill();
                } else {
                    ctx.fillStyle = p.color || '#ef4444';
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        // ===== СПАВН ЩИТА =====
        function spawnShield() {
            const y = 30 + Math.random() * (H - 60);
            shieldObjects.push({
                x: W + 20,
                y,
                r: 14,
                speed: 1.8 + Math.random() * 0.8,
                phase: Math.random() * Math.PI * 2,
            });
        }

        // ===== ИНИЦИАЛИЗАЦИЯ ИГРЫ =====
        function initGame() {
            player.y = H / 2;
            player.vy = 0;
            player.speed = 3.0;
            player.pulsePhase = 0;
            player.score = 0;
            lives = MAX_LIVES;
            speedMultiplier = 1.0;
            hasShield = false;
            shieldTimer = 0;
            currentScale = 1.0;
            targetScale = 1.0;
            heartParticles = [];
            cameraExplosionParticles = [];
            stars = [];
            clouds = [];
            shieldObjects = [];
            frameCount = 0;
            gameActive = true;
            gameState = STATE.PLAYING;
            gameOverOverlay.classList.remove('show');
            gameOverOverlay.style.display = 'none';
            menuOverlay.classList.add('hidden');
            updateUI();
            updateScaleDisplay();
            playMusic();
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(update, 1000 / 70); // 70 FPS
        }

        function spawnStar() {
            const y = 30 + Math.random() * (H - 60);
            stars.push({ x: W + 20, y, r: 12, speed: 1.5 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2 });
        }

        function spawnCloud() {
            const y = 30 + Math.random() * (H - 60);
            const size = 28 + Math.random() * 16;
            clouds.push({ x: W + 20, y, r: size, speed: 2.0 + Math.random() * 1.5, phase: Math.random() * Math.PI * 2 });
        }

        function updateUI() {
            scoreSpan.textContent = player.score;
            bestSpan.textContent = bestScore;
        }

        function updateScaleDisplay() {
            scaleDisplay.textContent = currentScale.toFixed(1);
        }

        // ===== ЗАВЕРШЕНИЕ ИГРЫ =====
        function gameOver() {
            gameActive = false;
            gameState = STATE.GAMEOVER;
            finalScoreSpan.textContent = player.score;
            spawnCameraExplosion(player.x, player.y);
            const heartSize = 24, spacing = 10;
            const totalWidth = MAX_LIVES * heartSize + (MAX_LIVES - 1) * spacing;
            const startX = (W - totalWidth) / 2;
            for (let i = 0; i < lives; i++) {
                const x = startX + i * (heartSize + spacing);
                const y = 20 + heartSize * 0.3;
                setTimeout(() => spawnHeartExplosion(x, y), i * 150);
            }
            setTimeout(() => {
                gameOverOverlay.style.display = 'flex';
                gameOverOverlay.classList.add('show');
                stopMusic();
                if (intervalId) clearInterval(intervalId);
            }, 600);
        }

        // ===== ОБНОВЛЕНИЕ =====
        function update() {
            if (!gameActive) return;

            // ---- Плавное изменение масштаба ----
            if (Math.abs(currentScale - targetScale) > 0.001) {
                currentScale += (targetScale - currentScale) * SCALE_SPEED;
            } else {
                currentScale = targetScale;
            }
            updateScaleDisplay();

            frameCount++;

            // ---- Управление ----
            const diff = targetY - player.y;
            player.vy += diff * 0.008;
            player.vy *= FRICTION;
            player.y += player.vy;
            const margin = 30;
            if (player.y < margin) { player.y = margin; player.vy = 0; }
            if (player.y > H - margin) { player.y = H - margin; player.vy = 0; }

            // ---- Пульсация ----
            player.pulsePhase += 0.05 * (player.speed / 8.0 + 0.3);

            // ---- Скорость ----
            const currentMaxSpeed = Math.min(3.0 + (speedMultiplier - 1.0) * 2, 8.0);
            if (player.speed < currentMaxSpeed) player.speed += 0.02;

            // ---- Щит ----
            if (hasShield) {
                shieldTimer--;
                if (shieldTimer <= 0) {
                    hasShield = false;
                    shieldTimer = 0;
                }
            }

            // ---- Спавн объектов (адаптировано под 70 FPS) ----
            const spawnRate = Math.max(18, 28 - speedMultiplier * 4); // подстроено под 70 FPS
            if (frameCount % Math.floor(spawnRate) === 0) spawnStar();
            if (frameCount % Math.floor(spawnRate * 1.6) === 0) spawnCloud();
            if (frameCount % Math.floor(spawnRate * 2.2) === 0 && frameCount > 100) spawnCloud();
            if (frameCount % Math.floor(spawnRate * 3.0) === 0 && frameCount > 150) spawnShield();

            // ---- Сбор звёзд ----
            const playerRadius = getPlayerRadius();
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                star.x -= star.speed * (player.speed / 3) * speedMultiplier;
                star.phase += 0.05;
                const dx = player.x - star.x, dy = player.y - star.y, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < playerRadius + star.r) {
                    player.score++;
                    if (player.score > bestScore) {
                        bestScore = player.score;
                        localStorage.setItem('niksBestScore', bestScore);
                    }
                    speedMultiplier = Math.min(speedMultiplier + SPEED_INCREMENT, MAX_SPEED_MULTIPLIER);
                    stars.splice(i, 1);
                    updateUI();
                    continue;
                }
                if (star.x < -20) stars.splice(i, 1);
            }

            // ---- Сбор щитов ----
            for (let i = shieldObjects.length - 1; i >= 0; i--) {
                const sh = shieldObjects[i];
                sh.x -= sh.speed * (player.speed / 3) * speedMultiplier;
                sh.phase += 0.05;
                const dx = player.x - sh.x, dy = player.y - sh.y, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < playerRadius + sh.r) {
                    hasShield = true;
                    shieldTimer = SHIELD_DURATION;
                    shieldObjects.splice(i, 1);
                    continue;
                }
                if (sh.x < -20) shieldObjects.splice(i, 1);
            }

            // ---- Столкновение с тучей ----
            for (let i = clouds.length - 1; i >= 0; i--) {
                const cloud = clouds[i];
                cloud.x -= cloud.speed * (player.speed / 3) * speedMultiplier;
                cloud.phase += 0.02;
                const dx = player.x - cloud.x, dy = player.y - cloud.y, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < playerRadius + cloud.r) {
                    if (hasShield) {
                        hasShield = false;
                        shieldTimer = 0;
                        clouds.splice(i, 1);
                        continue;
                    } else {
                        lives--;
                        spawnHeartExplosion(player.x, player.y - 30);
                        clouds.splice(i, 1);
                        if (lives <= 0) {
                            gameOver();
                            return;
                        } else {
                            player.vy = -2;
                            continue;
                        }
                    }
                }
                if (cloud.x < -40) clouds.splice(i, 1);
            }

            // ---- Частицы ----
            updateParticles();

            if (stars.length > 25) stars.splice(0, stars.length - 25);
            if (clouds.length > 18) clouds.splice(0, clouds.length - 18);
            if (shieldObjects.length > 5) shieldObjects.splice(0, shieldObjects.length - 5);
        }

        // ===== ОТРИСОВКА (вызывается в requestAnimationFrame) =====
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Шлейф
            const trailLen = 14;
            for (let i = 1; i < trailLen; i++) {
                const alpha = 0.25 * (1 - i/trailLen) * (player.speed/8.0 + 0.3);
                const hue = (i * 15 + Date.now() * 0.03) % 360;
                const size = (1 - i/trailLen) * getPlayerRadius() * 0.9;
                const xOff = -i * 4, yOff = -player.vy * i * 0.5;
                ctx.beginPath();
                ctx.arc(player.x + xOff, player.y + yOff, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
                ctx.fill();
            }

            // Звёзды
            for (let star of stars) {
                const pulse = 1 + 0.15 * Math.sin(star.phase);
                const r = star.r * pulse;
                const grad = ctx.createRadialGradient(star.x, star.y, 2, star.x, star.y, r * 2.5);
                grad.addColorStop(0, '#fbbf24');
                grad.addColorStop(0.5, 'rgba(251,191,36,0.3)');
                grad.addColorStop(1, 'rgba(251,191,36,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(star.x, star.y, r * 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fcd34d';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(star.x, star.y, r * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Щиты (синие)
            for (let sh of shieldObjects) {
                const pulse = 1 + 0.12 * Math.sin(sh.phase);
                const r = sh.r * pulse;
                const grad = ctx.createRadialGradient(sh.x, sh.y, 2, sh.x, sh.y, r * 2.2);
                grad.addColorStop(0, '#60a5fa');
                grad.addColorStop(0.5, 'rgba(96,165,250,0.3)');
                grad.addColorStop(1, 'rgba(96,165,250,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(sh.x, sh.y, r * 2.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#60a5fa';
                ctx.shadowColor = '#60a5fa';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(sh.x, sh.y, r * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.fillText('🛡️', sh.x, sh.y + 1);
            }

            // Тучи
            for (let cloud of clouds) {
                const pulse = 1 + 0.05 * Math.sin(cloud.phase);
                const r = cloud.r * pulse;
                ctx.fillStyle = 'rgba(180,190,200,0.4)';
                ctx.shadowColor = 'rgba(180,190,200,0.1)';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                for (let j = 0; j < 5; j++) {
                    const angle = j * 1.3 + cloud.phase;
                    const dx = Math.cos(angle) * r * 0.6, dy = Math.sin(angle) * r * 0.6;
                    ctx.beginPath();
                    ctx.arc(cloud.x + dx, cloud.y + dy, r * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(200,210,220,0.2)';
                    ctx.fill();
                }
            }

            // Камера
            if (gameState !== STATE.GAMEOVER || cameraExplosionParticles.length > 0) {
                drawPlayer(player, '#fbbf24');
            }

            // Щит вокруг камеры
            if (hasShield && gameState === STATE.PLAYING) {
                const shieldRadius = getPlayerRadius() * 1.8 + 8 * Math.sin(Date.now() * 0.005);
                const grad = ctx.createRadialGradient(player.x, player.y, 2, player.x, player.y, shieldRadius);
                grad.addColorStop(0, 'rgba(96,165,250,0.05)');
                grad.addColorStop(0.6, 'rgba(96,165,250,0.15)');
                grad.addColorStop(0.85, 'rgba(96,165,250,0.3)');
                grad.addColorStop(1, 'rgba(96,165,250,0.1)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(player.x, player.y, shieldRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = `rgba(96,165,250,${0.3 + 0.15 * Math.sin(Date.now() * 0.003)})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 8]);
                ctx.beginPath();
                ctx.arc(player.x, player.y, shieldRadius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                for (let i = 0; i < 8; i++) {
                    const angle = i * Math.PI/4 + Date.now() * 0.002;
                    const dist = shieldRadius * (0.85 + 0.15 * Math.sin(Date.now() * 0.005 + i));
                    const x = player.x + Math.cos(angle) * dist;
                    const y = player.y + Math.sin(angle) * dist;
                    ctx.beginPath();
                    ctx.arc(x, y, 2 + Math.sin(Date.now() * 0.01 + i) * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(147, 197, 253, ${0.3 + 0.2 * Math.sin(Date.now() * 0.004 + i)})`;
                    ctx.fill();
                }
                const progress = shieldTimer / SHIELD_DURATION;
                ctx.strokeStyle = 'rgba(96,165,250,0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x, player.y, shieldRadius + 8, 0, Math.PI * 2);
                ctx.stroke();
                ctx.strokeStyle = `rgba(96,165,250,${0.4 + 0.2 * Math.sin(Date.now() * 0.005)})`;
                ctx.beginPath();
                ctx.arc(player.x, player.y, shieldRadius + 8, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * progress);
                ctx.stroke();
            }

            // Жизни
            if (gameState === STATE.PLAYING) {
                const heartSize = 24, spacing = 10;
                const totalWidth = MAX_LIVES * heartSize + (MAX_LIVES - 1) * spacing;
                const startX = (W - totalWidth) / 2;
                for (let i = 0; i < lives; i++) {
                    const x = startX + i * (heartSize + spacing);
                    const y = 20;
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.moveTo(x, y + heartSize * 0.3);
                    ctx.bezierCurveTo(x - heartSize * 0.5, y - heartSize * 0.3, x - heartSize * 0.8, y + heartSize * 0.2, x, y + heartSize * 0.7);
                    ctx.bezierCurveTo(x + heartSize * 0.8, y + heartSize * 0.2, x + heartSize * 0.5, y - heartSize * 0.3, x, y + heartSize * 0.3);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // Частицы
            drawParticles();

            // Спидометр
            if (gameState === STATE.PLAYING) {
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.font = '12px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`⚡ ${Math.round(player.speed)} км/ч`, 12, H - 10);
                ctx.fillText(`x${speedMultiplier.toFixed(1)}`, 120, H - 10);
                if (hasShield) {
                    ctx.fillStyle = 'rgba(96,165,250,0.5)';
                    ctx.fillText(`🛡️ ${Math.ceil(shieldTimer/70)}с`, 200, H - 10);
                }
            }
        }

        function drawPlayer(p, color) {
            const pulse = 1 + 0.06 * Math.sin(p.pulsePhase);
            const scaleX = pulse * currentScale;
            const scaleY = (1 / pulse) * currentScale;
            if (cameraImg.complete && cameraImg.naturalWidth > 0) {
                ctx.save();
                ctx.translate(p.x, p.y);
                const baseSize = 50;
                const sizeX = baseSize * scaleX * (1 + (p.speed/8.0)*0.05);
                const sizeY = baseSize * scaleY * (1 + (p.speed/8.0)*0.05);
                ctx.drawImage(cameraImg, -sizeX/2, -sizeY/2, sizeX, sizeY);
                ctx.restore();
            } else {
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.baseRadius * pulse * currentScale, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#0a0a0c';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📷', p.x, p.y + 2);
            }
        }

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ===== УПРАВЛЕНИЕ =====
        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== STATE.PLAYING) return;
            const rect = canvas.getBoundingClientRect();
            const scaleY = canvas.height / rect.height;
            targetY = (e.clientY - rect.top) * scaleY;
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameState !== STATE.PLAYING) return;
            const rect = canvas.getBoundingClientRect();
            const scaleY = canvas.height / rect.height;
            const touch = e.touches[0];
            if (touch) targetY = (touch.clientY - rect.top) * scaleY;
        }, { passive: false });

        // ===== МАСШТАБИРОВАНИЕ =====
        zoomInBtn.addEventListener('click', () => {
            targetScale = Math.min(targetScale + SCALE_STEP, MAX_SCALE);
        });
        zoomOutBtn.addEventListener('click', () => {
            targetScale = Math.max(targetScale - SCALE_STEP, MIN_SCALE);
        });

        // ===== FULLSCREEN =====
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => {
                        console.warn('Не удалось перейти в полноэкранный режим:', err);
                    });
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });

        // ===== КНОПКИ =====
        startBtn.addEventListener('click', () => {
            menuOverlay.classList.add('hidden');
            initGame();
        });

        restartBtn.addEventListener('click', () => {
            gameOverOverlay.classList.remove('show');
            setTimeout(() => {
                gameOverOverlay.style.display = 'none';
                cameraExplosionParticles = [];
                heartParticles = [];
                initGame();
            }, 400);
        });

        menuBtn.addEventListener('click', () => {
            gameActive = false;
            gameState = STATE.MENU;
            gameOverOverlay.classList.remove('show');
            gameOverOverlay.style.display = 'none';
            menuOverlay.classList.remove('hidden');
            stars = [];
            clouds = [];
            shieldObjects = [];
            heartParticles = [];
            cameraExplosionParticles = [];
            player.score = 0;
            updateUI();
            stopMusic();
            if (intervalId) clearInterval(intervalId);
        });

        // ===== ЗАПУСК =====
        bestSpan.textContent = bestScore;
        gameLoop(); // запускаем цикл отрисовки
        cameraImg.onerror = function() { console.warn('Картинка не загрузилась'); };
    })();
</script>
</body>
</html>
