<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Небесный объектив — Щиты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
            margin: 0;
        }
        .game-wrapper {
            background: #16161a;
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            max-width: 700px;
            width: 100%;
            position: relative;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f4f4f5;
            font-size: 1.2rem;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .game-header.show { opacity: 1; }
        .game-header .score-wrap { display: flex; align-items: center; gap: 16px; }
        .game-header span { color: #fbbf24; }
        .speed-indicator {
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 14px;
            border-radius: 30px;
            color: #a1a1aa;
            font-weight: 600;
            min-width: 80px;
            text-align: center;
        }
        .speed-indicator strong { color: #fbbf24; font-size: 1.2rem; }
        #gameCanvas {
            width: 100%;
            height: 500px;
            background: radial-gradient(ellipse at 30% 20%, #132a44, #0a1628);
            border-radius: 20px;
            display: block;
            cursor: none;
            touch-action: none;
            position: relative;
        }
        .control-select-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 15;
            padding: 20px;
        }
        .control-select-overlay.show { display: flex; }
        .control-select-box {
            background: #1c1c22;
            padding: 36px 32px;
            border-radius: 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 340px;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .control-select-box h2 { color: #fff; font-size: 1.8rem; margin-bottom: 8px; }
        .control-select-box p { color: #a1a1aa; font-size: 0.95rem; margin-bottom: 24px; }
        .control-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .control-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f4f4f5;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            cursor: pointer;
            font-family: inherit;
            min-width: 120px;
        }
        .control-btn:hover { background: rgba(251, 191, 36, 0.15); border-color: #fbbf24; transform: scale(1.03); }
        .control-btn .icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
        .menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 12, 0.3);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            transition: opacity 0.8s ease;
            pointer-events: auto;
        }
        .menu-overlay.hidden { opacity: 0; pointer-events: none; }
        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f4f4f5;
            padding: 14px 44px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.1);
            letter-spacing: 0.5px;
        }
        .btn:hover { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; transform: scale(1.05); box-shadow: 0 0 60px rgba(251, 191, 36, 0.3); }
        .btn-primary { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        .btn-primary:hover { background: #fcd34d; transform: scale(1.05); }
        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .game-controls.show { opacity: 1; }
        .btn-up, .btn-down {
            background: rgba(251, 191, 36, 0.15);
            border-color: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            padding: 8px 20px;
            min-width: 60px;
            font-size: 1.2rem;
        }
        .btn-up:hover, .btn-down:hover { background: #fbbf24; color: #0a0a0c; }
        .btn-sm { padding: 8px 18px; font-size: 0.9rem; }
        .menu-btn-home { margin-top: 12px; }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
            flex-direction: column;
            padding: 20px;
        }
        .overlay.show { display: flex; }
        .overlay-box {
            background: #1c1c22;
            padding: 40px 36px;
            border-radius: 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 320px;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        @keyframes popIn {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .overlay-box h2 { color: #f87171; font-size: 2.2rem; margin-bottom: 6px; font-weight: 800; }
        .overlay-box p { color: #a1a1aa; font-size: 1.1rem; margin-bottom: 20px; }
        .overlay-box p strong { color: #fbbf24; font-size: 1.4rem; }
        .overlay-box .btn { background: #f87171; border-color: #f87171; color: #0a0a0c; padding: 12px 36px; }
        .overlay-box .btn:hover { background: #fca5a5; border-color: #fca5a5; transform: scale(1.05); }
        @media (max-width: 500px) {
            .game-wrapper { padding: 12px; }
            #gameCanvas { height: 400px; }
            .game-header { font-size: 1rem; }
            .btn { padding: 10px 24px; font-size: 1rem; }
            .btn-up, .btn-down { padding: 6px 14px; min-width: 44px; font-size: 1rem; }
            .control-select-box { padding: 28px 20px; }
            .control-select-box h2 { font-size: 1.5rem; }
            .control-btn { padding: 12px 16px; font-size: 0.9rem; min-width: 100px; }
            .overlay-box { padding: 30px 24px; }
            .overlay-box h2 { font-size: 1.8rem; }
        }
        @media (max-width: 400px) {
            .btn { padding: 8px 16px; font-size: 0.8rem; }
            .btn-up, .btn-down { padding: 4px 10px; min-width: 36px; font-size: 0.8rem; }
            .control-btn { padding: 10px 12px; font-size: 0.8rem; min-width: 80px; }
            .control-btn .icon { font-size: 1.2rem; }
            .overlay-box { padding: 24px 16px; }
            .overlay-box h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header" id="gameHeader">
            <div class="score-wrap">
                <div>📸 <span id="scoreDisplay">0</span></div>
                <div class="speed-indicator">⚡ <strong id="speedDisplay">0</strong> км/ч</div>
            </div>
            <div>🏆 <span id="bestDisplay">0</span></div>
        </div>

        <div style="position: relative;">
            <canvas id="gameCanvas" width="600" height="500"></canvas>
            <div class="menu-overlay" id="menuOverlay">
                <div style="text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <button class="btn btn-primary" id="startGameBtn" style="font-size: 1.4rem; padding: 16px 56px;">🚀 Играть</button>
                    <a href="https://reparsing.github.io/niksartphoto/" class="btn menu-btn-home" style="font-size: 1rem; padding: 10px 32px;">🏠 На главную</a>
                </div>
            </div>

            <div class="control-select-overlay" id="controlSelectOverlay">
                <div class="control-select-box">
                    <h2>🎮 Выбери управление</h2>
                    <p>Как ты хочешь управлять камерой?</p>
                    <div class="control-buttons">
                        <button class="control-btn" id="controlCursor"><span class="icon">🖱️</span>Курсор/палец</button>
                        <button class="control-btn" id="controlButtons"><span class="icon">🔘</span>Кнопки ▲▼</button>
                    </div>
                </div>
            </div>

            <div class="overlay" id="gameOverOverlay">
                <div class="overlay-box">
                    <h2>💥 Игра окончена</h2>
                    <p>Счёт: <strong id="finalScore">0</strong></p>
                    <button class="btn" id="restartFromOverlayBtn">🔄 Играть снова</button>
                </div>
            </div>
        </div>

        <div class="game-controls" id="gameControls">
            <button class="btn btn-up" id="upBtn">▲</button>
            <button class="btn btn-primary btn-sm" id="restartBtn">🔄 Заново</button>
            <button class="btn btn-sm" id="menuBtn" style="display: none;">📋 Меню</button>
            <button class="btn btn-down" id="downBtn">▼</button>
        </div>
    </div>

    <script>
        (function() {
            // ===== ИНИЦИАЛИЗАЦИЯ =====
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const bestSpan = document.getElementById('bestDisplay');
            const speedSpan = document.getElementById('speedDisplay');
            const finalScoreSpan = document.getElementById('finalScore');
            const menuOverlay = document.getElementById('menuOverlay');
            const startBtn = document.getElementById('startGameBtn');
            const restartBtn = document.getElementById('restartBtn');
            const restartOverlayBtn = document.getElementById('restartFromOverlayBtn');
            const menuBtn = document.getElementById('menuBtn');
            const overlay = document.getElementById('gameOverOverlay');
            const gameHeader = document.getElementById('gameHeader');
            const gameControls = document.getElementById('gameControls');
            const controlSelectOverlay = document.getElementById('controlSelectOverlay');
            const controlCursor = document.getElementById('controlCursor');
            const controlButtons = document.getElementById('controlButtons');

            const W = 600, H = 500;
            const cameraImg = new Image();
            cameraImg.crossOrigin = 'Anonymous';
            cameraImg.src = 'https://raw.githubusercontent.com/Reparsing/niksartphoto/main/images/camera.png';

            // ===== СОСТОЯНИЯ =====
            const STATE = { MENU: 0, SELECT: 1, PLAYING: 2, GAMEOVER: 3 };
            let gameState = STATE.MENU;
            let controlMode = 'cursor';
            
            // ===== ИГРОК =====
            let player = {
                x: W / 2, y: H / 2, vy: 0,
                radius: 28,
                pulsePhase: 0,
                speed: 3.0,
                hasShield: false,
                shieldTimer: 0,
                maxShieldTime: 300,
            };
            let stars = [], clouds = [], shields = [];
            let score = 0;
            let bestScore = parseInt(localStorage.getItem('niksBestScore')) || 0;
            let gameActive = false;
            let frameId = null;
            let frameCount = 0;
            const GRAVITY = 0.15, JUMP_FORCE = -0.5, MAX_SPEED = 8.0, FRICTION = 0.98;

            // ===== ЭФФЕКТ ТРЯСКИ =====
            let shakeAmount = 0;
            let shakeX = 0, shakeY = 0;

            // ===== МУЗЫКА =====
            function playMusic() {
                backgroundMusic.play().catch(e => console.log('Автовоспроизведение заблокировано'));
            }
            function stopMusic() {
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
            }

            // ===== ИНИЦИАЛИЗАЦИЯ ИГРЫ =====
            function startPlaying() {
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.pulsePhase = 0;
                player.hasShield = false;
                player.shieldTimer = 0;
                player.x = 80;
                score = 0;
                gameActive = true;
                frameCount = 0;
                stars = [];
                clouds = [];
                shields = [];
                shakeAmount = 0;
                gameState = STATE.PLAYING;
                overlay.classList.remove('show');
                gameHeader.classList.add('show');
                gameControls.classList.add('show');
                menuBtn.style.display = 'inline-block';
                updateUI();
                playMusic();
            }

            // ===== СПАВН ОБЪЕКТОВ =====
            function spawnStar() {
                const y = 30 + Math.random() * (H - 60);
                stars.push({ x: W + 20, y, r: 12, speed: 1.5 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2 });
            }
            function spawnCloud() {
                const y = 30 + Math.random() * (H - 60);
                const size = 28 + Math.random() * 16;
                clouds.push({ x: W + 20, y, r: size, speed: 2.0 + Math.random() * 1.5, phase: Math.random() * Math.PI * 2 });
            }
            function spawnShield() {
                const y = 30 + Math.random() * (H - 60);
                shields.push({ x: W + 20, y, r: 14, speed: 1.8 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2 });
            }

            function updateUI() {
                scoreSpan.textContent = score;
                bestSpan.textContent = bestScore;
                speedSpan.textContent = Math.round(player.speed);
            }

            // ===== УПРАВЛЕНИЕ КНОПКАМИ =====
            let upPressed = false, downPressed = false;
            ['upBtn', 'downBtn'].forEach(id => {
                const btn = document.getElementById(id);
                if (!btn) return;
                const start = (e) => { e.preventDefault(); if (id === 'upBtn') upPressed = true; else downPressed = true; };
                const end = (e) => { e.preventDefault(); upPressed = false; downPressed = false; };
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
                btn.addEventListener('mouseleave', end);
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end, { passive: false });
                btn.addEventListener('touchcancel', end);
            });

            // ===== УПРАВЛЕНИЕ КУРСОРОМ =====
            let targetY = player.y;
            canvas.addEventListener('mousemove', (e) => {
                if (gameState !== STATE.PLAYING || controlMode !== 'cursor') return;
                const rect = canvas.getBoundingClientRect();
                const scaleY = canvas.height / rect.height;
                targetY = (e.clientY - rect.top) * scaleY;
            });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (gameState !== STATE.PLAYING || controlMode !== 'cursor') return;
                const rect = canvas.getBoundingClientRect();
                const scaleY = canvas.height / rect.height;
                const touch = e.touches[0];
                if (touch) targetY = (touch.clientY - rect.top) * scaleY;
            }, { passive: false });

            // ===== ОБНОВЛЕНИЕ =====
            function update() {
                if (!gameActive || gameState !== STATE.PLAYING) return;
                frameCount++;

                // Управление
                if (controlMode === 'cursor') {
                    const diff = targetY - player.y;
                    player.vy += diff * 0.006;
                } else {
                    if (upPressed) player.vy += JUMP_FORCE;
                    if (downPressed) player.vy += GRAVITY * 0.8;
                }

                // Физика
                player.vy += GRAVITY;
                player.vy *= FRICTION;
                player.y += player.vy;
                const margin = 30;
                if (player.y < margin) { player.y = margin; player.vy = 0; }
                if (player.y > H - margin) { player.y = H - margin; player.vy = 0; }
                player.pulsePhase += 0.05 * (player.speed / MAX_SPEED + 0.3);

                // Таймер щита
                if (player.hasShield) {
                    player.shieldTimer--;
                    if (player.shieldTimer <= 0) {
                        player.hasShield = false;
                        player.shieldTimer = 0;
                    }
                }

                // Скорость
                if (frameCount % 60 === 0 && player.speed < MAX_SPEED) player.speed += 0.05;

                // Спавн
                if (frameCount % 35 === 0) spawnStar();
                if (frameCount % 55 === 0) spawnCloud();
                if (frameCount % 70 === 0 && frameCount > 100) spawnShield();
                if (frameCount % 80 === 0 && frameCount > 100) spawnCloud();

                // Сбор звёзд
                for (let i = stars.length - 1; i >= 0; i--) {
                    const star = stars[i];
                    star.x -= star.speed * (player.speed / 3);
                    star.phase += 0.05;
                    const dx = player.x - star.x, dy = player.y - star.y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.radius + star.r) {
                        score++;
                        if (score > bestScore) { bestScore = score; localStorage.setItem('niksBestScore', bestScore); }
                        stars.splice(i, 1);
                        updateUI();
                        continue;
                    }
                    if (star.x < -20) stars.splice(i, 1);
                }

                // Сбор щитов
                for (let i = shields.length - 1; i >= 0; i--) {
                    const shield = shields[i];
                    shield.x -= shield.speed * (player.speed / 3);
                    shield.phase += 0.05;
                    const dx = player.x - shield.x, dy = player.y - shield.y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.radius + shield.r) {
                        player.hasShield = true;
                        player.shieldTimer = player.maxShieldTime;
                        shields.splice(i, 1);
                        shakeAmount = 4;
                        continue;
                    }
                    if (shield.x < -20) shields.splice(i, 1);
                }

                // Столкновение с тучей
                for (let i = clouds.length - 1; i >= 0; i--) {
                    const cloud = clouds[i];
                    cloud.x -= cloud.speed * (player.speed / 3);
                    cloud.phase += 0.02;
                    const dx = player.x - cloud.x, dy = player.y - cloud.y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.radius + cloud.r) {
                        if (player.hasShield) {
                            clouds.splice(i, 1);
                            shakeAmount = 12;
                            continue;
                        } else {
                            gameActive = false;
                            gameState = STATE.GAMEOVER;
                            finalScoreSpan.textContent = score;
                            overlay.classList.add('show');
                            gameControls.classList.remove('show');
                            stopMusic();
                            return;
                        }
                    }
                    if (cloud.x < -40) clouds.splice(i, 1);
                }

                if (stars.length > 20) stars.splice(0, stars.length - 20);
                if (clouds.length > 15) clouds.splice(0, clouds.length - 15);
                if (shields.length > 5) shields.splice(0, shields.length - 5);
            }

            // ===== ОТРИСОВКА =====
            function draw() {
                ctx.save();

                // Эффект тряски
                if (shakeAmount > 0) {
                    shakeX = (Math.random() - 0.5) * shakeAmount * 1.2;
                    shakeY = (Math.random() - 0.5) * shakeAmount * 1.2;
                    shakeAmount *= 0.92;
                    if (shakeAmount < 0.2) shakeAmount = 0;
                    ctx.translate(shakeX, shakeY);
                }

                ctx.clearRect(0, 0, W, H);

                // ===== ШЛЕЙФ =====
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
                    const trailLen = 18;
                    for (let i = 1; i < trailLen; i++) {
                        const alpha = 0.3 * (1 - i / trailLen) * (player.speed / MAX_SPEED + 0.3);
                        const hue = (i * 15 + Date.now() * 0.03) % 360;
                        const size = (1 - i / trailLen) * player.radius * 0.9;
                        const xOff = -i * 4, yOff = -player.vy * i * 0.5;
                        ctx.beginPath();
                        ctx.arc(player.x + xOff, player.y + yOff, size, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
                        ctx.fill();
                    }
                }

                // ===== ЗВЁЗДЫ =====
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
                    for (let star of stars) {
                        const pulse = 1 + 0.15 * Math.sin(star.phase);
                        const r = star.r * pulse;
                        const grad = ctx.createRadialGradient(star.x, star.y, 2, star.x, star.y, r * 2.5);
                        grad.addColorStop(0, '#fbbf24');
                        grad.addColorStop(0.5, 'rgba(251,191,36,0.3)');
                        grad.addColorStop(1, 'rgba(251,191,36,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, r * 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fcd34d';
                        ctx.shadowColor = '#fbbf24';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, r * 0.6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }

                    // ===== ЩИТЫ =====
                    for (let shield of shields) {
                        const pulse = 1 + 0.12 * Math.sin(shield.phase);
                        const r = shield.r * pulse;
                        const grad = ctx.createRadialGradient(shield.x, shield.y, 2, shield.x, shield.y, r * 2.2);
                        grad.addColorStop(0, '#60a5fa');
                        grad.addColorStop(0.5, 'rgba(96,165,250,0.3)');
                        grad.addColorStop(1, 'rgba(96,165,250,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(shield.x, shield.y, r * 2.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#60a5fa';
                        ctx.shadowColor = '#60a5fa';
                        ctx.shadowBlur = 25;
                        ctx.beginPath();
                        ctx.arc(shield.x, shield.y, r * 0.6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.font = '16px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#fff';
                        ctx.fillText('🛡️', shield.x, shield.y + 1);
                    }

                    // ===== ТУЧИ =====
                    for (let cloud of clouds) {
                        const pulse = 1 + 0.05 * Math.sin(cloud.phase);
                        const r = cloud.r * pulse;
                        ctx.fillStyle = 'rgba(180,190,200,0.4)';
                        ctx.shadowColor = 'rgba(180,190,200,0.1)';
                        ctx.shadowBlur = 30;
                        ctx.beginPath();
                        ctx.arc(cloud.x, cloud.y, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        for (let j = 0; j < 5; j++) {
                            const angle = j * 1.3 + cloud.phase;
                            const dx = Math.cos(angle) * r * 0.6, dy = Math.sin(angle) * r * 0.6;
                            ctx.beginPath();
                            ctx.arc(cloud.x + dx, cloud.y + dy, r * 0.4, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(200,210,220,0.2)';
                            ctx.fill();
                        }
                    }
                }

                // ===== КАМЕРА =====
                const pulse = 1 + 0.06 * Math.sin(player.pulsePhase);
                const scaleX = pulse, scaleY = 1 / pulse;
                let drawX = player.x, drawY = player.y;
                if (gameState === STATE.MENU || gameState === STATE.SELECT) { drawX = W / 2; drawY = H / 2; }
                if (cameraImg.complete && cameraImg.naturalWidth > 0) {
                    ctx.save();
                    ctx.translate(drawX, drawY);
                    const baseSize = (gameState === STATE.MENU || gameState === STATE.SELECT) ? 100 : 70;
                    const sizeX = baseSize * scaleX * (1 + (player.speed / MAX_SPEED) * 0.05);
                    const sizeY = baseSize * scaleY * (1 + (player.speed / MAX_SPEED) * 0.05);
                    ctx.drawImage(cameraImg, -sizeX / 2, -sizeY / 2, sizeX, sizeY);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, player.radius * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#0a0a0c';
                    ctx.font = '32px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('📷', drawX, drawY + 2);
                }

                // ===== ЭФФЕКТ ЩИТА =====
                if (player.hasShield && gameState === STATE.PLAYING) {
                    const shieldRadius = player.radius * 1.8 + 8 * Math.sin(Date.now() * 0.005);
                    const grad = ctx.createRadialGradient(player.x, player.y, 2, player.x, player.y, shieldRadius);
                    grad.addColorStop(0, 'rgba(96,165,250,0.05)');
                    grad.addColorStop(0.6, 'rgba(96,165,250,0.15)');
                    grad.addColorStop(0.85, 'rgba(96,165,250,0.3)');
                    grad.addColorStop(1, 'rgba(96,165,250,0.1)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, shieldRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = `rgba(96,165,250,${0.3 + 0.15 * Math.sin(Date.now() * 0.003)})`;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 8]);
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, shieldRadius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    for (let i = 0; i < 8; i++) {
                        const angle = i * Math.PI / 4 + Date.now() * 0.002;
                        const dist = shieldRadius * (0.85 + 0.15 * Math.sin(Date.now() * 0.005 + i));
                        const x = player.x + Math.cos(angle) * dist;
                        const y = player.y + Math.sin(angle) * dist;
                        ctx.beginPath();
                        ctx.arc(x, y, 2 + Math.sin(Date.now() * 0.01 + i) * 1.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(147, 197, 253, ${0.3 + 0.2 * Math.sin(Date.now() * 0.004 + i)})`;
                        ctx.fill();
                    }
                    const progress = player.shieldTimer / player.maxShieldTime;
                    ctx.strokeStyle = 'rgba(96,165,250,0.2)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, shieldRadius + 8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = `rgba(96,165,250,${0.4 + 0.2 * Math.sin(Date.now() * 0.005)})`;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, shieldRadius + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
                    ctx.stroke();
                }

                // ===== ЭФФЕКТЫ МЕНЮ =====
                if (gameState === STATE.MENU || gameState === STATE.SELECT) {
                    const time = Date.now() * 0.001;
                    for (let i = 0; i < 16; i++) {
                        const angle = i * (Math.PI / 8) + time * 0.3;
                        const radius = 100 + 20 * Math.sin(time * 0.5 + i);
                        const x = W / 2 + Math.cos(angle) * radius;
                        const y = H / 2 + Math.sin(angle) * radius * 0.5;
                        const alpha = 0.15 + 0.1 * Math.sin(time + i);
                        ctx.beginPath();
                        ctx.arc(x, y, 3 + 2 * Math.sin(time * 0.7 + i), 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(251, 191, 36, ${alpha})`;
                        ctx.fill();
                    }
                    for (let i = 0; i < 10; i++) {
                        const angle = i * (Math.PI / 5) + time * 0.2;
                        const x1 = W / 2 + Math.cos(angle) * 70;
                        const y1 = H / 2 + Math.sin(angle) * 35;
                        const x2 = W / 2 + Math.cos(angle + 0.15) * 130;
                        const y2 = H / 2 + Math.sin(angle + 0.15) * 65;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = `rgba(251, 191, 36, ${0.06 + 0.04 * Math.sin(time + i)})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }

                // ===== СПИДОМЕТР =====
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '12px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(`⚡ ${Math.round(player.speed)} км/ч`, 12, H - 10);
                    if (player.hasShield) {
                        ctx.fillStyle = 'rgba(96,165,250,0.5)';
                        ctx.fillText(`🛡️ ${Math.ceil(player.shieldTimer / 60)}с`, 120, H - 10);
                    }
                }

                ctx.restore();
            }

            function gameLoop() {
                update();
                draw();
                frameId = requestAnimationFrame(gameLoop);
            }

            // ===== УПРАВЛЕНИЕ СОСТОЯНИЯМИ =====
            function startGame() {
                menuOverlay.classList.add('hidden');
                controlSelectOverlay.classList.add('show');
                gameState = STATE.SELECT;
            }

            function selectControl(mode) {
                controlMode = mode;
                controlSelectOverlay.classList.remove('show');
                // Сразу запускаем игру без лишнего перехода
                player.x = 80;
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.pulsePhase = 0;
                player.hasShield = false;
                player.shieldTimer = 0;
                gameActive = true;
                frameCount = 0;
                stars = [];
                clouds = [];
                shields = [];
                score = 0;
                shakeAmount = 0;
                gameState = STATE.PLAYING;
                overlay.classList.remove('show');
                gameHeader.classList.add('show');
                gameControls.classList.add('show');
                menuBtn.style.display = 'inline-block';
                targetY = player.y;
                updateUI();
                playMusic();
            }

            function goToMenu() {
                gameState = STATE.MENU;
                gameActive = false;
                overlay.classList.remove('show');
                menuOverlay.classList.remove('hidden');
                controlSelectOverlay.classList.remove('show');
                gameHeader.classList.remove('show');
                gameControls.classList.remove('show');
                menuBtn.style.display = 'none';
                stars = [];
                clouds = [];
                shields = [];
                player.x = W / 2;
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.hasShield = false;
                player.shieldTimer = 0;
                score = 0;
                shakeAmount = 0;
                updateUI();
                stopMusic();
            }

            function restartGame() {
                overlay.classList.remove('show');
                gameState = STATE.PLAYING;
                gameActive = true;
                player.x = 80;
                player.y = H / 2;
                player.vy = 0;
                player.speed = 3.0;
                player.pulsePhase = 0;
                player.hasShield = false;
                player.shieldTimer = 0;
                score = 0;
                stars = [];
                clouds = [];
                shields = [];
                frameCount = 0;
                shakeAmount = 0;
                gameControls.classList.add('show');
                updateUI();
                playMusic();
            }

            // ===== ПОДКЛЮЧАЕМ КНОПКИ =====
            startBtn.addEventListener('click', startGame);
            controlCursor.addEventListener('click', () => selectControl('cursor'));
            controlButtons.addEventListener('click', () => selectControl('buttons'));
            restartBtn.addEventListener('click', restartGame);
            restartOverlayBtn.addEventListener('click', restartGame);
            menuBtn.addEventListener('click', goToMenu);

            // ===== ЗАПУСК =====
            gameState = STATE.MENU;
            player.x = W / 2;
            player.y = H / 2;
            bestSpan.textContent = bestScore;
            frameId = requestAnimationFrame(gameLoop);
            cameraImg.onerror = function() { console.warn('Картинка не загрузилась, используется эмодзи'); };
        })();
    </script>
</body>
</html>
